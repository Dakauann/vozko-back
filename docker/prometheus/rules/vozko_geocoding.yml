groups:
  - name: vozko_geocoding
    rules:
      - alert: GeocodingBacklogRising
        expr: max by (status) (deriv(app_geocoding_backlog{status=~"pending|unavailable"}[30m])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Geocoding backlog ({{ $labels.status }}) has been rising for an hour"
          description: >-
            Addresses waiting for a position with status {{ $labels.status }} kept growing
            for an hour, so the sweeper is not keeping up. Check the sweeper logs and
            whether the IBGE reference is loaded for the states of those addresses
            (geo_reference_loads, cmd/georef). A single large import drains on its own
            and does not fire this alert.

