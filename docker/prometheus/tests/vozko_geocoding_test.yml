rule_files:
  - ../rules/vozko_geocoding.yml
evaluation_interval: 1m
tests:
  - name: a backlog that keeps rising fires, one that drains does not
    interval: 1m
    input_series:
      - series: 'app_geocoding_backlog{status="pending",replica_id="a"}'
        values: '100+10x150'
      - series: 'app_geocoding_backlog{status="pending",replica_id="b"}'
        values: '100x150'
      - series: 'app_geocoding_backlog{status="unavailable",replica_id="a"}'
        values: '5000+0x30 5000-50x100'
    alert_rule_test:
      - eval_time: 60m
        alertname: GeocodingBacklogRising
        exp_alerts: []
      - eval_time: 100m
        alertname: GeocodingBacklogRising
        exp_alerts:
          - exp_labels:
              severity: warning
              status: pending
            exp_annotations:
              summary: "Geocoding backlog (pending) has been rising for an hour"
              description: "Addresses waiting for a position with status pending kept growing for an hour, so the sweeper is not keeping up. Check the sweeper logs and whether the IBGE reference is loaded for the states of those addresses (geo_reference_loads, cmd/georef). A single large import drains on its own and does not fire this alert."

  - name: one large import that drains does not fire
    interval: 1m
    input_series:
      - series: 'app_geocoding_backlog{status="pending",replica_id="a"}'
        values: '100 50000 49900-100x150'
    alert_rule_test:
      - eval_time: 120m
        alertname: GeocodingBacklogRising
        exp_alerts: []
