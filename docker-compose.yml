services:
  app:
    build: .
    container_name: vozko-api
    env_file:
      - .env
    environment:
      DB_HOST: localhost
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-vozko}
      APP_ENV: ${APP_ENV:-production}
      PORT: 3000
      PROMETHEUS_URL: http://localhost:9090
      RABBITMQ_HOST: localhost
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SIP_DEBUG: "true"
      SIP_SKIP_REGISTER: "false"
      WHISPER_URLS: ${WHISPER_URLS:-http://localhost:17071}
      WHISPER_MODEL: ${WHISPER_MODEL:-ggml-large-v3-turbo}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      VOZKO_PII_KEK_V1: ${VOZKO_PII_KEK_V1}
      VOZKO_PII_BLIND_INDEX_KEY: ${VOZKO_PII_BLIND_INDEX_KEY}
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_started
      # ollama:
      #   condition: service_healthy
      redis:
        condition: service_healthy
      # prometheus and grafana are NOT hard dependencies — monitoring is
      # non-essential. If they're down, the app still functions; metrics
      # queries will simply return errors until they recover.
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:8.6.0-alpine
    container_name: vozko-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(sed -n 's/^user default on >\\([^ ]*\\).*/\\1/p' /run/secrets/redis-users.acl) redis-cli ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./docker/redis/users.acl:/run/secrets/redis-users.acl:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: vozko-prometheus
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.listen-address=127.0.0.1:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.0
    container_name: vozko-grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3001"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001}"
      GF_LOG_MODE: "console file"
      GF_LOG_LEVEL: "info"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: vozko-ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    environment:
      OLLAMA_HOST: 0.0.0.0
      # 30m, matching the keep_alive the Go embedding client sends on every
      # request. A shorter default here just means the model can be evicted
      # between the client's own 4-minute keep-alive pings, and reloading
      # bge-m3 from disk costs seconds on CPU.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # One slot with every core, which is measurably better than several.
      #
      # The default of 4 is wrong here: on CPU one embed already saturates the
      # cores it is given, so extra slots add no throughput, they only divide
      # them. Two slots were tried explicitly, on the theory that a customer's
      # query could take a free lane while indexing held the other. It does not
      # work: an embed request carrying a whole batch is atomic to the scheduler,
      # so the query still waits for the in-flight batch AND every batch is now
      # half as fast. Measured, query while indexing: 1.1s at 1 slot x 12
      # threads, 8.1s at 2 slots x 6. The lever for that latency is making each
      # batch finish sooner, not adding lanes.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      # The whole cpuset, since there is only ever one slot to feed.
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-12}
      # The single biggest win on CPU, and it is not obvious.
      #
      # bge-m3 is an ENCODER: llama.cpp runs the forward pass over the slot's
      # whole allocated context, not over the tokens actually sent. At Ollama's
      # 4096 default that meant a 7-token query cost the same as a 4096-token
      # one, a flat ~4.5s per request no matter how short the question. Chunks
      # here are 800 chars (~200 tokens) and queries are one sentence, so 1024
      # keeps a 4x safety margin over the largest real input while cutting that
      # fixed cost proportionally. Raise it only if a knowledge base is
      # configured with a chunkSize above ~3000 characters, since anything
      # longer than the context is silently truncated before embedding.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-1024}
      # Only bge-m3 is ever requested; allowing a second resident model would
      # double the memory floor for nothing.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-bge-m3}
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    restart: unless-stopped
    # Pinned to the 12 cores of ONE NUMA node, not to a range.
    #
    # Two reasons, and the second is easy to get backwards. First, llama.cpp
    # sizes its thread pool from the CPU count it detects and a cgroup cpus quota
    # does not change that count, so without a cpuset the container saw all 24
    # cores, spawned 24 threads, and had them throttled into a fraction of the
    # machine. Second, this box is dual-socket: node0 is 0-5,12-17 and node1 is
    # 6-11,18-23. A natural-looking "0-11" straddles both sockets, so half the
    # threads read the weights across the interconnect. Embedding is memory
    # bandwidth bound, and that split measured ~10x SLOWER than no pinning at
    # all. Keep every core in this list inside one node; check `lscpu` before
    # changing it, the numbering is not contiguous per node.
    cpuset: "${OLLAMA_CPUSET:-0-5,12-17}"
    # Deprioritised, not merely capped. The cpuset already leaves node1's 12
    # cores permanently free for Postgres, the API and RabbitMQ, and the
    # scheduler migrates those unpinned processes onto the idle node when this
    # one is busy. cpu_shares then decides what happens on the shared cores when
    # both want them at once: at half the default weight, embedding yields to
    # anything serving a customer instead of competing with it. It costs nothing
    # while the box is idle, which is almost always.
    cpu_shares: ${OLLAMA_CPU_SHARES:-512}
    healthcheck:
      test:
        ["CMD-SHELL", "ollama list | grep -q ${OLLAMA_MODEL:-bge-m3} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # CPU-only. This host has no NVIDIA device and the Docker daemon exposes
    # only the runc runtime, so a `reservations.devices` block asking for a gpu
    # capability makes the service fail to create outright ("could not select
    # device driver"), which is why it had never started here. Re-add the block
    # only on a host that actually has the nvidia runtime.
    deploy:
      resources:
        limits:
          # bge-m3 is ~1.2G resident; the rest is headroom for concurrent
          # batches. Capped so a runaway embed job cannot reach the API,
          # Postgres or RabbitMQ, which share this box.
          memory: ${OLLAMA_MEMORY_LIMIT:-6G}
          # Matches the cpuset width below, so the quota is never the binding
          # constraint and threads are not throttled mid-batch.
          cpus: "${OLLAMA_CPUS:-12.0}"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vozko-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  traefik:
    profiles: ["gpu"]
    image: traefik:v3.2
    container_name: stt-traefik
    networks:
      - stt-network
    volumes:
      - ./docker/traefik:/etc/traefik:ro
    ports:
      - "${HOST_STT_PORT:-17071}:8080"
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  x-stt-common: &stt-common
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.stt
      args:
        MODEL_NAME: ${STT_MODEL:-ggml-large-v3-q5_0.bin}
    networks:
      - stt-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STT_GPU:-1}"]
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      THREADS: ${WHISPER_THREADS:-8}
      PROCESSORS: ${WHISPER_PROCESSORS:-1}
      LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      HOST: 0.0.0.0
      PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  stt-vozko-1:
    <<: *stt-common
    container_name: stt-vozko-1

  stt-vozko-2:
    <<: *stt-common
    container_name: stt-vozko-2

  stt-vozko-3:
    <<: *stt-common
    container_name: stt-vozko-3

volumes:
  rabbitmq_data:
    name: vozko_rabbitmq_data
  prometheus_data:
    name: vozko_prometheus_data
  grafana_data:
    name: vozko_grafana_data
  redis_data:
    name: vozko_redis_data
  ollama_data:
    name: vozko_ollama_data

networks:
  stt-network:
    name: stt-network
    driver: bridge
