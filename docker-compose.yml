services:
  app:
    build: .
    container_name: vozko-api
    env_file:
      - .env
    environment:
      DB_HOST: localhost
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-vozko}
      APP_ENV: ${APP_ENV:-production}
      PORT: 3000
      PROMETHEUS_URL: http://localhost:9090
      RABBITMQ_HOST: localhost
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SIP_DEBUG: "true"
      SIP_SKIP_REGISTER: "false"
      WHISPER_URLS: ${WHISPER_URLS:-http://localhost:17071}
      WHISPER_MODEL: ${WHISPER_MODEL:-ggml-large-v3-turbo}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      VOZKO_PII_KEK_V1: ${VOZKO_PII_KEK_V1}
      VOZKO_PII_BLIND_INDEX_KEY: ${VOZKO_PII_BLIND_INDEX_KEY}
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_started
      # ollama:
      #   condition: service_healthy
      redis:
        condition: service_healthy
      # prometheus and grafana are NOT hard dependencies — monitoring is
      # non-essential. If they're down, the app still functions; metrics
      # queries will simply return errors until they recover.
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:8.6.0-alpine
    container_name: vozko-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(sed -n 's/^user default on >\\([^ ]*\\).*/\\1/p' /run/secrets/redis-users.acl) redis-cli ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./docker/redis/users.acl:/run/secrets/redis-users.acl:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: vozko-prometheus
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.listen-address=127.0.0.1:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.0
    container_name: vozko-grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3001"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001}"
      GF_LOG_MODE: "console file"
      GF_LOG_LEVEL: "info"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: vozko-ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-bge-m3}
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "ollama list | grep -q ${OLLAMA_MODEL:-bge-m3} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-4G}
          cpus: "4.0"
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OLLAMA_GPU:-0}"]
              capabilities: [gpu]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vozko-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  traefik:
    profiles: ["gpu"]
    image: traefik:v3.2
    container_name: stt-traefik
    networks:
      - stt-network
    volumes:
      - ./docker/traefik:/etc/traefik:ro
    ports:
      - "${HOST_STT_PORT:-17071}:8080"
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  x-stt-common: &stt-common
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.stt
      args:
        MODEL_NAME: ${STT_MODEL:-ggml-large-v3-q5_0.bin}
    networks:
      - stt-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STT_GPU:-1}"]
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      THREADS: ${WHISPER_THREADS:-8}
      PROCESSORS: ${WHISPER_PROCESSORS:-1}
      LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      HOST: 0.0.0.0
      PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  stt-vozko-1:
    <<: *stt-common
    container_name: stt-vozko-1

  stt-vozko-2:
    <<: *stt-common
    container_name: stt-vozko-2

  stt-vozko-3:
    <<: *stt-common
    container_name: stt-vozko-3

volumes:
  rabbitmq_data:
    name: vozko_rabbitmq_data
  prometheus_data:
    name: vozko_prometheus_data
  grafana_data:
    name: vozko_grafana_data
  redis_data:
    name: vozko_redis_data
  ollama_data:
    name: vozko_ollama_data

networks:
  stt-network:
    name: stt-network
    driver: bridge
