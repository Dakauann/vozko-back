  /conversations/{entryType}/{entryId}/scheduled-messages:
    get:
      description: Lista as mensagens agendadas de uma conversa e o estado atual da
        janela de atendimento. Use o parâmetro `status` (separado por vírgula) para
        filtrar.
      parameters:
      - description: Tipo da entrada
        in: path
        name: entryType
        required: true
        type: string
      - description: ID da entrada
        in: path
        name: entryId
        required: true
        type: string
      - description: 'Filtro de status: pending,sending,sent,failed,canceled'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scheduledmessage.ScheduledMessageListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar mensagens agendadas de uma conversa
      tags:
      - Mensagens Agendadas
    post:
      consumes:
      - application/json
      description: Agenda uma mensagem para ser enviada em uma conversa. Uma mensagem
        de texto ou mídia precisa cair dentro da janela de atendimento aberta. Um
        template (campo `template`, só no WhatsApp oficial) pode ser agendado com
        a janela fechada, até 30 dias à frente; ele segue as mesmas regras de um envio
        de template (aprovação, acesso ao template, contato bloqueado, proteção contra
        spam) e é cobrado no momento do envio. Agendar, reagendar ou cancelar um template
        exige a permissão whatsapp_templates:send. O horário precisa estar a pelo
        menos um minuto de distância. Envie o cabeçalho `Idempotency-Key` para que
        um reenvio da requisição não crie uma segunda mensagem.
      parameters:
      - description: Tipo da entrada
        in: path
        name: entryType
        required: true
        type: string
      - description: ID da entrada
        in: path
        name: entryId
        required: true
        type: string
      - description: Chave para tornar a criação idempotente
        in: header
        name: Idempotency-Key
        type: string
      - description: Mensagem e horário do agendamento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/scheduledmessage.ScheduleMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: A chave de idempotência já havia sido usada; nada novo foi
            criado
          schema:
            $ref: '#/definitions/scheduledmessage.ScheduledMessageEnvelope'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/scheduledmessage.ScheduledMessageEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: A janela de atendimento está fechada
          schema:
            $ref: '#/definitions/scheduledmessage.WindowErrorResponse'
        "422":
          description: O horário escolhido está fora dos limites, ou o template não
            pode ser enviado a este contato
          schema:
            $ref: '#/definitions/scheduledmessage.WindowErrorResponse'
      security:
      - BearerAuth: []
      summary: Agendar uma mensagem
      tags:
      - Mensagens Agendadas
  /crm/board:
    get:
      description: Renderiza o quadro global do CRM do workspace, agrupado por etapa,
        etiqueta, responsável ou sem agrupamento, aplicando o filtro reutilizável,
        o pipeline e a paginação informados. Cada coluna traz suas conversas paginadas
        e o total.
      parameters:
      - description: ID do pipeline que escopa o quadro
        in: query
        name: pipelineId
        type: string
      - description: Eixo de agrupamento ('stage', 'label', 'owner' ou 'none')
        in: query
        name: groupBy
        type: string
      - description: Filtro crmfilter em JSON (opcionalmente codificado em base64)
        in: query
        name: filter
        type: string
      - description: Colunas do eixo responsável em JSON com id e nome (opcionalmente
          em base64)
        in: query
        name: owners
        type: string
      - description: Campo de ordenação
        in: query
        name: sortField
        type: string
      - description: Direção da ordenação ('asc' ou 'desc')
        in: query
        name: sortOrder
        type: string
      - description: Número da página (inicia em 1)
        in: query
        name: page
        type: integer
      - description: Tamanho da página (máximo 200)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/crmboard_usecase.Board'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Quadro do CRM
      tags:
      - CRM
  /crm/bulk:
    post:
      consumes:
      - application/json
      description: Aplica uma única ação (mover de etapa, atribuir, adicionar ou remover
        etiqueta) a várias conversas de uma só vez.
      parameters:
      - description: Ação, alvos e valor
        in: body
        name: body
