      description: 'Monta a tabela de Relatórios de Anúncios no servidor, com as mesmas
        fórmulas do gerenciador: tabela dinâmica (por item e quebras), barras (por
        quebras, ou por item sem quebras, do maior para o menor na primeira métrica)
        ou tendência (por dia). metricKinds diz o tipo de cada métrica (money em micros
        da moeda da conta, count, percent, decimal); alcance e frequência só valem
