  workspace_addon.WorkspaceEntitlement:
    properties:
      addonUnits:
        type: integer
      kind:
        $ref: '#/definitions/workspace_addon.EntitlementKind'
      planBase:
        type: integer
      total:
        type: integer
    type: object
  workspace_config.UpdateWorkspaceConfigOwnerInput:
    properties:
      autoCloseEnabled:
        type: boolean
      autoCloseIdleAfterHours:
        type: integer
      autoCloseMaxAgeAfterHours:
        type: integer
      autoCloseMaxAgeEnabled:
        type: boolean
      outcomeCapture:
        $ref: '#/definitions/conversation.OutcomeCapture'
      rouletteLastSeenWindowHours:
        type: integer
      rouletteMode:
        type: string
      rouletteRescueAfterMinutes:
        type: integer
      rouletteRescueEnabled:
