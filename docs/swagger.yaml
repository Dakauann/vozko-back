basePath: /
definitions:
  actor.Kind:
    enum:
    - human
    - ai
    - system
    type: string
    x-enum-varnames:
    - KindHuman
    - KindAI
    - KindSystem
  affiliate.AffiliateProfileResponse:
    properties:
      affiliate:
        $ref: '#/definitions/affiliate.AffiliateResponse'
      stats:
        $ref: '#/definitions/affiliate.StatsResponse'
    type: object
  affiliate.AffiliateResponse:
    properties:
      active:
        example: true
        type: boolean
      asaasWalletId:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      brandLogoUrl:
        example: https://cdn.exemplo.com/logo.png
        type: string
      brandName:
        example: Minha Marca
        type: string
      code:
        example: MINHA-MARCA
        type: string
      commissionPct:
        example: 0.05
        type: number
      createdAt:
        type: string
      id:
        example: aff_a1b2c3
        type: string
      tier:
        example: affiliate
        type: string
      updatedAt:
        type: string
      userId:
        example: usr_a1b2c3
        type: string
    type: object
  affiliate.EarningListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/affiliate.EarningResponse'
        type: array
      meta:
        $ref: '#/definitions/response.PaginationMeta'
    type: object
  affiliate.EarningResponse:
    properties:
      affiliateId:
        example: aff_a1b2c3
        type: string
      amountMicros:
        example: 1500000
        type: integer
      createdAt:
        type: string
      exchangeRateMicros:
        example: 5200000
        type: integer
      id:
        example: earn_a1b2c3
        type: string
      invoiceId:
        example: inv_a1b2c3
        type: string
      purpose:
        example: subscription
        type: string
      status:
        example: pending
        type: string
      workspaceId:
        example: ws_a1b2c3
        type: string
    type: object
  affiliate.ReferralListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/affiliate.ReferralResponse'
        type: array
      meta:
        $ref: '#/definitions/response.PaginationMeta'
    type: object
  affiliate.ReferralResponse:
    properties:
      affiliateId:
        example: aff_a1b2c3
        type: string
      id:
        example: ref_a1b2c3
        type: string
      referredAt:
        type: string
      workspaceId:
        example: ws_a1b2c3
        type: string
    type: object
  affiliate.ReferralValidationResponse:
    properties:
      brandLogoUrl:
        example: https://cdn.exemplo.com/logo.png
        type: string
      brandName:
        example: Minha Marca
        type: string
      code:
        example: MINHA-MARCA
        type: string
      valid:
        example: true
        type: boolean
    type: object
  affiliate.RegisterAffiliateRequest:
    properties:
      asaasWalletId:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      brandLogoUrl:
        example: https://cdn.exemplo.com/logo.png
        type: string
      brandName:
        example: Minha Marca
        type: string
      code:
        example: MINHA-MARCA
        type: string
    type: object
  affiliate.StatsResponse:
    properties:
      monthEarningMicros:
        example: 250000
        type: integer
      totalEarningMicros:
        example: 1500000
        type: integer
      totalReferrals:
        example: 42
        type: integer
    type: object
  affiliate.UpdateAffiliateRequest:
    properties:
      asaasWalletId:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      brandLogoUrl:
        example: https://cdn.exemplo.com/logo.png
        type: string
      brandName:
        example: Minha Marca
        type: string
    type: object
  agent_presence.OccupancyRow:
    properties:
      occupancy:
        type: number
      on_call_ms:
        type: integer
      online_ms:
        type: integer
      user_id:
        type: string
    type: object
  analysis.Analysis:
    properties:
      attendanceQuality:
        type: integer
      createdAt:
        type: string
      disposition:
        $ref: '#/definitions/analysis.Disposition'
      entryId:
        type: string
      entryType:
        $ref: '#/definitions/shared.EntryType'
      id:
        type: string
      interest:
        $ref: '#/definitions/analysis.Interest'
      messageCount:
        type: integer
      nextAction:
        $ref: '#/definitions/analysis.NextAction'
      productInterest:
        type: string
      qualification:
        $ref: '#/definitions/analysis.Qualification'
      sentiment:
        $ref: '#/definitions/analysis.Sentiment'
      summary:
        type: string
    type: object
  analysis.AnalysisStats:
    properties:
      avgAttendanceQuality:
        type: number
      avgMessagesPerAnalysis:
        type: number
      dispositionCallback:
        type: integer
      dispositionDeclined:
        type: integer
      dispositionFillingInfo:
        type: integer
      dispositionNoAnswer:
        type: integer
      dispositionPending:
        type: integer
      dispositionSale:
        type: integer
      dispositionVoicemail:
        type: integer
      interestInterested:
        type: integer
      interestNotInterested:
        type: integer
      interestUndecided:
        type: integer
      maxAttendanceQuality:
        type: integer
      minAttendanceQuality:
        type: integer
      qualificationColdLead:
        type: integer
      qualificationHotLead:
        type: integer
      qualificationWarmLead:
        type: integer
      sentimentNegative:
        type: integer
      sentimentNeutral:
        type: integer
      sentimentPositive:
        type: integer
      totalAnalyses:
        type: integer
      totalMessages:
        type: integer
    type: object
  analysis.Disposition:
    enum:
    - sale
    - filling_info
    - callback
    - declined
    - no_answer
    - voicemail
    - pending
    type: string
    x-enum-varnames:
    - DispositionSale
    - DispositionFillingInfo
    - DispositionCallback
    - DispositionDeclined
    - DispositionNoAnswer
    - DispositionVoicemail
    - DispositionPending
  analysis.Interest:
    enum:
    - interested
    - not_interested
    - undecided
    type: string
    x-enum-varnames:
    - InterestInterested
    - InterestNotInterested
    - InterestUndecided
  analysis.NextAction:
    enum:
    - schedule_callback
    - send_whatsapp
    - close
    - escalate
    - continue
    type: string
    x-enum-varnames:
    - NextActionScheduleCallback
    - NextActionSendWhatsApp
    - NextActionClose
    - NextActionEscalate
    - NextActionContinue
  analysis.Qualification:
    enum:
    - hot_lead
    - warm_lead
    - cold_lead
    type: string
    x-enum-varnames:
    - QualificationHotLead
    - QualificationWarmLead
    - QualificationColdLead
  analysis.Sentiment:
    enum:
    - positive
    - neutral
    - negative
    type: string
    x-enum-varnames:
    - SentimentPositive
    - SentimentNeutral
    - SentimentNegative
  attendance.AIAgentStats:
    properties:
      abandoned:
        type: integer
      agent_id:
        type: string
      avg_ai_messages:
        type: number
      contained:
        type: integer
      containment_rate:
        type: number
      handed_off:
        type: integer
      handoff_rate:
        type: number
      sessions:
        type: integer
    type: object
  attendance.AttendantStats:
    properties:
      actor_kind:
        description: ActorKind is always "human" for workspace members; AI stats use
          AIAgentStats.
        type: string
      assigned_count:
        type: integer
      avg_response_time_mins:
        type: number
      email:
        type: string
      responded_count:
        type: integer
      response_rate:
        type: number
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  attendance.ChannelSlice:
    properties:
      channel:
        description: whatsapp | voice
        type: string
      count:
        type: integer
      pct:
        type: number
    type: object
  attendance.DepartmentRow:
    properties:
      avg_handle_mins:
        type: number
      avg_wait_mins:
        type: number
      department_id:
        type: string
      department_name:
        type: string
      finished:
        type: integer
      finished_ai:
        type: integer
      finished_human:
        description: |-
          Finished split by close_source (same rules as OverviewFinishedBySource).
          Gamification: intentional (human+ai) vs silence (system), not queue abandon.
        type: integer
      finished_system:
        type: integer
      ongoing:
        type: integer
      pending:
        type: integer
    type: object
  attendance.FRTStats:
    properties:
      ai_avg_mins:
        type: number
      ai_samples:
        type: integer
      avg_frt_mins:
        type: number
      human_avg_mins:
        type: number
      human_samples:
        type: integer
      median_frt_mins:
        type: number
      sample_count:
        type: integer
    type: object
  attendance.HourlyPoint:
    properties:
      count:
        type: integer
      hour:
        type: integer
    type: object
  attendance.MemberRow:
    properties:
      actor_id:
        type: string
      actor_kind:
        description: human | ai
        type: string
      avg_response_mins:
        type: number
      display_name:
        type: string
      email:
        type: string
      finished_ai:
        type: integer
      finished_human:
        description: How assigned finished chats were closed (for fair ranking vs
          silence auto-close).
        type: integer
      finished_system:
        type: integer
      open:
        description: ongoing
        type: integer
      pending:
        description: new/empty
        type: integer
      presence:
        description: online | offline | on_call | unknown
        type: string
      rating:
        description: null until CSAT
        type: number
      resolution_pct:
        type: number
      resolved:
        description: finished (all close sources)
        type: integer
    type: object
  attendance.MetricDefinitions:
    properties:
      ai:
        type: string
      channel_mix:
        type: string
      csat:
        type: string
      engaged:
        type: string
      finished_by_source:
        type: string
      frt:
        type: string
      handle_time:
        type: string
      messaging:
        type: string
      occupancy:
        type: string
      period_scope:
        type: string
      queue:
        type: string
      reopen:
        type: string
      resolution:
        type: string
      shell:
        type: string
      sla:
        type: string
      status_mapping:
        type: string
      unassigned:
        type: string
      wait_time:
        type: string
    type: object
  attendance.Overview:
    properties:
      ai:
        $ref: '#/definitions/attendance.OverviewAI'
      by_department:
        items:
          $ref: '#/definitions/attendance.DepartmentRow'
        type: array
      by_member:
        items:
          $ref: '#/definitions/attendance.MemberRow'
        type: array
      channel_mix:
        items:
          $ref: '#/definitions/attendance.ChannelSlice'
        type: array
      definitions:
        $ref: '#/definitions/attendance.MetricDefinitions'
      filter:
        $ref: '#/definitions/attendance.OverviewFilter'
      finished_by_source:
        allOf:
        - $ref: '#/definitions/attendance.OverviewFinishedBySource'
        description: FinishedBySource splits KPIs.Finished by close_source for monthly
          review.
      frt:
        allOf:
        - $ref: '#/definitions/attendance.OverviewFRT'
        description: Extended operational blocks
      hourly:
        items:
          $ref: '#/definitions/attendance.HourlyPoint'
        type: array
      kpis:
        $ref: '#/definitions/attendance.OverviewKPIs'
      live:
        $ref: '#/definitions/attendance.OverviewLive'
      messaging:
        $ref: '#/definitions/attendance.OverviewMessaging'
      occupancy:
        $ref: '#/definitions/attendance.OverviewOccupancy'
      queue:
        $ref: '#/definitions/attendance.OverviewQueue'
      reopen:
        $ref: '#/definitions/attendance.OverviewReopen'
      status_distribution:
        $ref: '#/definitions/attendance.StatusDistribution'
    type: object
  attendance.OverviewAI:
    properties:
      abandoned:
        type: integer
      available:
        description: true when any session in range
        type: boolean
      avg_ai_messages:
        type: number
      contained:
        type: integer
      containment_rate:
        type: number
      handed_off:
        type: integer
      handoff_rate:
        type: number
      open_sessions:
        type: integer
      sessions:
        type: integer
    type: object
  attendance.OverviewFRT:
    properties:
      ai_avg_mins:
        type: number
      ai_samples:
        type: integer
      available:
        description: true when sample_count > 0
        type: boolean
      avg_mins:
        type: number
      human_avg_mins:
        type: number
      human_samples:
        type: integer
      median_mins:
        type: number
      sample_count:
        type: integer
    type: object
  attendance.OverviewFilter:
    properties:
      campaign_id:
        type: string
      campaign_type:
        description: whatsapp | voice | ""
        type: string
      channel:
        description: whatsapp | voice | support | ""
        type: string
      date_from:
        type: string
      date_to:
        type: string
      department_id:
        type: string
      include_ai:
        type: boolean
      member_id:
        description: human user id
        type: string
    type: object
  attendance.OverviewFinishedBySource:
    properties:
      ai:
        description: AI finish tool
        type: integer
      ai_pct:
        type: number
      available:
        description: true when total > 0
        type: boolean
      human:
        description: intentional human (or legacy empty)
        type: integer
      human_pct:
        type: number
      system:
        description: idle auto-close
        type: integer
      system_pct:
        type: number
      total:
        description: human+ai+system (= finished when fully classified)
        type: integer
    type: object
  attendance.OverviewKPIs:
    properties:
      avg_frt_mins:
        description: AvgFRTMins is assignment-aware first response (null when no samples).
        type: number
      avg_handle_mins:
        description: null when no samples
        type: number
      avg_rating:
        description: always null until CSAT
        type: number
      avg_wait_mins:
        type: number
      csat_available:
        type: boolean
      engaged:
        description: 'Engaged: scoped entries with at least one non-deleted message.'
        type: integer
      entries_created:
        description: 'EntriesCreated: entries created in range (is_new_contact), including
          shells.'
        type: integer
      finished:
        description: engaged only
        type: integer
      frt_sla_percent:
        description: SLA placeholders (null until SLA policies exist)
        type: number
      new_contacts:
        description: engaged + created in range
        type: integer
      ongoing:
        description: engaged only
        type: integer
      pending:
        description: engaged only
        type: integer
      resolution_sla_percent:
        type: number
      shell_backlog:
        description: 'ShellBacklog: scoped entries with zero messages (campaign shells).'
        type: integer
      sla_available:
        type: boolean
      total_scoped:
        description: 'TotalScoped: engaged + shell (raw period universe).'
        type: integer
      unassigned_backlog:
        description: 'UnassignedBacklog: engaged, no inbox assignee, not finished.'
        type: integer
    type: object
  attendance.OverviewLive:
    properties:
      agents:
        items:
          $ref: '#/definitions/attendance.OverviewLiveAgent'
        type: array
      as_of:
        type: string
      busy_rate_pct:
        type: number
      free:
        description: Free is online and not busy (available to take a call).
        type: integer
      has_data:
        description: HasData is true when the dialer registry was queried successfully.
        type: boolean
      idle_rate_pct:
        description: 'IdleRatePct among online agents: free/online * 100 (ociosidade
          ao vivo).'
        type: number
      in_call:
        description: busy (on a call or ringing)
        type: integer
      online:
        description: connected to dialer
        type: integer
    type: object
  attendance.OverviewLiveAgent:
    properties:
      busy:
        type: boolean
      has_branch:
        type: boolean
      has_browser:
        type: boolean
      user_id:
        type: string
    type: object
  attendance.OverviewMessaging:
    properties:
      available:
        type: boolean
      avg_inbound:
        type: number
      avg_messages_all_scoped:
        description: 'Dual denominator: average including shells (zeros). Null when
          no scoped rows.'
        type: number
      avg_messages_per_conversation:
        description: Primary averages are over ENGAGED entries only (total_msgs >
          0).
        type: number
      avg_outbound:
        type: number
      avg_template:
        description: |-
          Template messages (WhatsApp HSM / session openers). Counted separately so
          ops can see billed-style template volume, not only free-form operator chat.
        type: number
      conversations_with_messages:
        type: integer
      conversations_with_template:
        description: Conversations that received at least one template message.
        type: integer
      template_messages:
        type: integer
    type: object
  attendance.OverviewOccupancy:
    properties:
      agents_sampled:
        type: integer
      available:
        type: boolean
      avg_occupancy_pct:
        description: mean of per-agent occupancy
        type: number
      on_call_ms:
        type: integer
      online_ms:
        type: integer
      team_idle_pct:
        description: 'TeamIdlePct is ociosidade histórica: 100 - TeamOccupancyPct
          (when available).'
        type: number
      team_occupancy_pct:
        description: 'TeamOccupancyPct: OnCallMS / OnlineMS (online already includes
          on_call in source)'
        type: number
    type: object
  attendance.OverviewQueue:
    properties:
      abandon_rate:
        description: percent
        type: number
      abandoned:
        type: integer
      available:
        description: true when enqueued > 0
        type: boolean
      avg_asa_mins:
        description: ASA in minutes
        type: number
      cancelled:
        type: integer
      connected:
        type: integer
      enqueued:
        type: integer
      overflow:
        type: integer
      queue_full:
        type: integer
    type: object
  attendance.OverviewReopen:
    properties:
      available:
        type: boolean
      finished_count:
        description: FinishedCount is engaged finished (same universe as KPIs.Finished)
          for rate.
        type: integer
      finished_event_count:
        description: FinishedEventCount is event_type=finished telemetry (may include
          out-of-scope shells).
        type: integer
      reopen_rate:
        description: reopened/finished_count * 100 when finished_count > 0
        type: number
      reopened_count:
        type: integer
    type: object
  attendance.ResponseTimeBucket:
    properties:
      count:
        type: integer
      label:
        type: string
    type: object
  attendance.ResponseTimeDistribution:
    properties:
      buckets:
        items:
          $ref: '#/definitions/attendance.ResponseTimeBucket'
        type: array
      total:
        type: integer
    type: object
  attendance.StatusDistribution:
    properties:
      finished:
        type: integer
      ongoing:
        type: integer
      pending:
        type: integer
      total:
        type: integer
    type: object
  attendance.WindowBucket:
    properties:
      count:
        type: integer
      label:
        type: string
    type: object
  attendance.WindowStats:
    properties:
      buckets:
        items:
          $ref: '#/definitions/attendance.WindowBucket'
        type: array
      total_open:
        type: integer
    type: object
  auth.AuthTokenResponse:
    properties:
      accessToken:
        example: eyJhbGciOi...
        type: string
      customerType:
        example: company
        type: string
      email:
        example: contato@clinica.com.br
        type: string
      name:
        example: Clínica Sorriso
        type: string
      picture:
        example: https://cdn.example.com/avatars/usr_a1b2c3.png
        type: string
      refreshToken:
        example: rt_a1b2c3d4
        type: string
      role:
        example: user
        type: string
      tokenType:
        example: Bearer
        type: string
      userId:
        example: usr_a1b2c3
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      currentPassword:
        example: SenhaForte1
        type: string
      newPassword:
        example: NovaSenhaForte1
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  auth.EmailVerificationQueuedResponse:
    properties:
      message:
        example: Verification email queued
        type: string
      success:
        example: true
        type: boolean
    type: object
  auth.ForgotPasswordRequest:
    properties:
      email:
        example: contato@clinica.com.br
        type: string
    required:
    - email
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: contato@clinica.com.br
        type: string
      password:
        example: SenhaForte1
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutRequest:
    properties:
      sessionId:
        example: sess_a1b2c3d4
        type: string
    type: object
  auth.MessageResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  auth.RefreshTokenRequest:
    properties:
      refreshToken:
        example: rt_a1b2c3d4
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      cnpj:
        example: "12345678000190"
        type: string
      cpf:
        example: "12345678901"
        type: string
      customerType:
        enum:
        - individual
        - company
        example: company
        type: string
      email:
        example: contato@clinica.com.br
        type: string
      name:
        example: Clínica Sorriso
        type: string
      password:
        example: SenhaForte1
        type: string
      referralCode:
        example: PARCEIRO10
        type: string
      verificationToken:
        example: "123456"
        type: string
    required:
    - customerType
    - email
    - name
    - password
    - verificationToken
    type: object
  auth.ResetPasswordRequest:
    properties:
      email:
        example: contato@clinica.com.br
        type: string
      newPassword:
        example: NovaSenhaForte1
        type: string
      token:
        example: reset_a1b2c3d4
        type: string
    required:
    - email
    - newPassword
    - token
    type: object
  auth.SendEmailVerificationRequest:
    properties:
      email:
        example: contato@clinica.com.br
        type: string
    required:
    - email
    type: object
  auth.SessionResponse:
    properties:
      createdAt:
        type: string
      deviceInfo:
        example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        type: string
      expiresAt:
        type: string
      id:
        example: sess_a1b2c3d4
        type: string
      ipAddress:
        example: 200.150.10.20
        type: string
      isCurrent:
        example: true
        type: boolean
      location:
        example: São Paulo, BR
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      token:
        example: "123456"
        type: string
    required:
    - token
    type: object
  balance.Balance:
    properties:
      amount:
        type: integer
      createdAt:
        type: string
      currency:
        type: string
      id:
        type: string
      updatedAt:
        type: string
      workspaceId:
        type: string
    type: object
  balance.FullBalanceSummary:
    properties:
      balance:
        $ref: '#/definitions/balance.Balance'
      totalMoneyCredits:
        type: integer
      totalMoneyDebits:
        type: integer
    type: object
  balance.ResourceType:
    enum:
    - money
    type: string
    x-enum-varnames:
    - ResourceTypeMoney
