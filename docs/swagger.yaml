        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar tronco SIP
      tags:
      - Troncos SIP
  /sip-trunks/{id}:
    delete:
      description: Remove um tronco SIP do workspace, cancela a registração no provedor
        e encerra as chamadas em andamento por ele.
      parameters:
      - description: ID do tronco
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/siptrunk.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover tronco SIP
      tags:
      - Troncos SIP
    get:
      description: Retorna um tronco SIP do workspace com o estado atual da registração.
      parameters:
      - description: ID do tronco
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/siptrunk.TrunkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obter tronco SIP
      tags:
      - Troncos SIP
    put:
      consumes:
      - application/json
      description: Atualiza um tronco SIP do workspace. Todos os campos são opcionais
        e apenas os informados são alterados; omitir a senha mantém a atual. O tronco
        se registra de novo com a configuração nova.
      parameters:
      - description: ID do tronco
        in: path
        name: id
        required: true
        type: string
      - description: Campos do tronco a atualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/siptrunk.UpdateTrunkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/siptrunk.TrunkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar tronco SIP
      tags:
      - Troncos SIP
