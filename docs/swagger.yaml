  /leads/import:
    post:
      consumes:
      - application/json
      description: Cria leads em massa a partir de uma lista de contatos já processada
        pelo cliente (por exemplo, um CSV lido no navegador). Números são normalizados
        para o formato brasileiro canônico e deduplicados; linhas inválidas ou repetidas
        são reportadas, nunca descartadas em silêncio. Leads já existentes no workspace
        são contabilizados como "matched" e nunca sobrescritos. Opcionalmente abre
        uma conversa no atendimento para cada número (seedInbox).
      parameters:
      - description: Linhas do arquivo
        in: body
        name: request
        required: true
