        e aceita só origens exatas (https://www.exemplo.com) ou subdomínios (https://*.exemplo.com);
        http só para localhost. O chat só abre nesses sites. Agente, fluxo, funil
        e departamento precisam ser deste workspace (422 reference_not_in_workspace).
        Com identityMode optional ou required é gerado um segredo para assinar a identidade
