          $ref: '#/definitions/savedview.SavedViewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/savedview.SavedView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar uma visão salva
      tags:
      - Visões Salvas
  /saved-views/{id}:
    delete:
      description: Exclui uma visão salva do usuário.
      parameters:
      - description: ID da visão salva
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Visão removida
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover uma visão salva
      tags:
      - Visões Salvas
    put:
      consumes:
      - application/json
      description: Atualiza os filtros, o agrupamento, a ordenação e os demais atributos
