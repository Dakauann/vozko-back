    get:
      description: Lista as memórias registradas sobre um lead (fatos salvos pela
        IA e por operadores), da mais recente para a mais antiga.
      parameters:
      - description: ID do lead
        in: path
        name: id
        required: true
        type: string
      - description: 'Filtro de categoria: personal | preference | deal | objection
          | commitment | event | other'
        in: query
        name: category
        type: string
      - description: Máximo de itens (padrão 50)
        in: query
        name: limit
        type: integer
