  /attendance/stats:
    get:
      description: Retorna as métricas de atendimento por atendente do workspace (atribuídos,
        respondidos, taxa de resposta e tempo médio de resposta), com filtro opcional
        por período e campanha.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: ID da campanha
        in: query
        name: campaign_id
        type: string
      - description: Tipo da campanha
        in: query
        name: campaign_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/attendance.AttendantStats'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Estatísticas de atendentes
      tags:
      - Atendimento
  /attendance/targets:
    get:
      description: Lista as metas do workspace para o período informado (mês). Usuários
        restritos a departamentos veem apenas as metas do próprio escopo.
      parameters:
      - description: 'Período no formato YYYY-MM (padrão: mês atual)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/attendance_target.Target'
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar metas de atendimento
      tags:
      - Atendimento
    put:
      consumes:
      - application/json
      description: Cria ou atualiza a meta de uma métrica para um período, no escopo
        do workspace, de um departamento ou de um membro. Períodos já encerrados são
        recusados.
      parameters:
      - description: Meta a gravar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/attendance.TargetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/attendance_target.Target'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Definir meta de atendimento
      tags:
      - Atendimento
  /attendance/targets/{id}:
    delete:
      description: Remove a meta informada. Metas de períodos já encerrados não podem
        ser removidas.
      parameters:
      - description: ID da meta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover meta de atendimento
      tags:
      - Atendimento
  /attendance/windows:
    get:
      description: Retorna o total de conversas abertas do workspace agrupadas por
        faixas de tempo desde a última interação, com filtro opcional por período
        e campanha.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: ID da campanha
        in: query
        name: campaign_id
        type: string
      - description: Tipo da campanha
        in: query
        name: campaign_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/attendance.WindowStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Estatísticas de janelas de atendimento
      tags:
      - Atendimento
  /audience/usage:
    get:
      description: 'Quanto o workspace analisou na janela móvel de 24 horas e o teto
        em vigor. É a resposta a "por que a cobertura está baixa": ao atingir o teto
        a análise pausa até que as horas mais antigas saiam da janela.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audience.Usage'
      security:
      - BearerAuth: []
      summary: Uso da análise contra o teto do workspace
      tags:
      - Analysis
  /audience/workspace-settings:
    get:
      description: Teto de análises e tempo de silêncio antes de analisar uma conversa.
        Zero significa "não definido", e o valor efetivo vem junto.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audience.WorkspaceSettingsResponse'
      security:
      - BearerAuth: []
      summary: Configuração de análise do workspace
      tags:
      - Analysis
    put:
      consumes:
      - application/json
      description: Define o teto de análises na janela móvel de 24 horas e/ou quantos
        minutos a conversa precisa ficar sem mensagens antes de ser analisada. Vale
        para o workspace inteiro, em todos os canais.
      parameters:
      - description: Campos a alterar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/audience.UpdateWorkspaceSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audience.WorkspaceSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Alterar a configuração de análise do workspace
      tags:
      - Analysis
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Altera a senha do usuário autenticado e revoga todas as suas sessões.
        Exige a senha atual.
      parameters:
      - description: Senha atual e nova senha
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Alterar a senha do usuário atual
      tags:
      - Autenticação
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Envia um link de redefinição de senha se existir uma conta com
        o email informado. Sempre retorna 200 para não revelar quais emails estão
        cadastrados.
      parameters:
      - description: Email da conta
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Solicitar redefinição de senha
      tags:
      - Autenticação
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Autentica um usuário com credenciais e retorna um par de tokens
        de acesso e atualização. Clientes SPA de navegador que enviam `X-Auth-Mode:
        cookie` recebem os tokens como cookies httpOnly e os campos de token são omitidos
        do corpo.'
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: AUTH_INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: AUTH_RATE_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login com email e senha
      tags:
      - Autenticação
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoga a sessão do usuário (ou a sessão indicada por `sessionId`)
        e limpa os cookies de autenticação.
      parameters:
      - description: ID de sessão opcional (padrão é a sessão atual)
        in: body
        name: request
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Encerrar uma sessão
      tags:
      - Autenticação
  /auth/logout-all:
    post:
      description: Revoga todas as sessões do usuário autenticado e limpa os cookies
        de autenticação.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Encerrar todas as sessões
      tags:
      - Autenticação
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotaciona o token de atualização e retorna um novo par de tokens.
        O token de atualização pode ser enviado no corpo ou, para clientes SPA de
        navegador, como o cookie httpOnly `refreshToken`.
      parameters:
      - description: Token de atualização (opcional quando enviado como cookie)
        in: body
        name: request
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Renovar o token de acesso
      tags:
      - Autenticação
  /auth/register:
    post:
      consumes:
      - application/json
      description: Cria uma nova conta de cliente após a verificação do email. Exige
        um `verificationToken` válido e um CPF (pessoa física) ou CNPJ (pessoa jurídica)
        correspondente ao `customerType`.
      parameters:
      - description: Dados de cadastro
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: AUTH_EMAIL_ALREADY_EXISTS / AUTH_DOCUMENT_ALREADY_EXISTS
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: AUTH_INVALID_DOCUMENT
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Cadastrar uma nova conta
      tags:
      - Autenticação
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Conclui a redefinição de senha usando o token enviado por email.
      parameters:
      - description: Token de redefinição e nova senha
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Redefinir a senha com um token
      tags:
      - Autenticação
  /auth/send-email-verification:
    post:
      consumes:
      - application/json
      description: Coloca na fila um email de verificação para o endereço informado.
        Possui limite de envio por email.
      parameters:
      - description: Email a verificar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendEmailVerificationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/auth.EmailVerificationQueuedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: AUTH_RATE_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Enviar um código de verificação de email
      tags:
      - Autenticação
  /auth/sessions:
    get:
      description: Retorna todas as sessões de autenticação ativas do usuário atual,
        destacando a que fez a requisição.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.SessionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar sessões ativas
      tags:
      - Autenticação
  /auth/sessions/{sessionId}:
    delete:
      description: Revoga uma única sessão do usuário autenticado pelo id.
      parameters:
      - description: ID da sessão a revogar
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revogar uma sessão específica
      tags:
      - Autenticação
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Marca o email do usuário como verificado usando o token enviado
        a ele por email.
      parameters:
      - description: Token de verificação
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verificar um email com um token
      tags:
      - Autenticação
  /builder-sessions:
    get:
      description: Retorna as conversas mais recentes com o copiloto de IA em todo
        o workspace, independentemente do fluxo.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/buildersession.BuilderSessionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar conversas do copiloto do workspace
      tags:
      - Copiloto de fluxos
  /builder-sessions/{sessionId}:
    get:
      description: Retorna uma conversa específica com o copiloto de IA, incluindo
        todas as mensagens e chamadas de ferramenta registradas.
      parameters:
      - description: ID da conversa
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/buildersession.BuilderSessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Carregar uma conversa do copiloto
      tags:
      - Copiloto de fluxos
  /calendar/events:
    get:
      description: Retorna a lista paginada de eventos da agenda do workspace, com
        filtros opcionais por período e busca textual.
      parameters:
      - description: Número da página (inicia em 1)
        in: query
        name: page
        type: integer
      - description: Quantidade de itens por página
        in: query
        name: pageSize
        type: integer
      - description: Busca textual por título ou descrição
        in: query
        name: search
        type: string
      - description: Data inicial no formato RFC3339
        in: query
        name: from
        type: string
      - description: Data final no formato RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.EventListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar eventos da agenda
      tags:
      - Agenda
    post:
      consumes:
      - application/json
      description: Cria um novo evento na agenda do workspace. Quando o Google Agenda
        está conectado, o evento também é sincronizado com o Google.
      parameters:
      - description: Dados do evento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/calendar.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/calendar.EventEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar um evento na agenda
      tags:
      - Agenda
  /calendar/events/{id}:
    delete:
      description: Remove um evento da agenda do workspace. Quando o Google Agenda
        está conectado, o evento também é removido do Google.
      parameters:
      - description: Identificador do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.DeletedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover um evento da agenda
      tags:
      - Agenda
    get:
      description: Retorna os detalhes de um evento da agenda a partir do seu identificador.
      parameters:
      - description: Identificador do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.EventEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar um evento da agenda
      tags:
      - Agenda
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um evento existente. Somente os campos enviados
        são alterados.
      parameters:
      - description: Identificador do evento
        in: path
        name: id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/calendar.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.EventEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar um evento da agenda
      tags:
      - Agenda
  /calendar/google/auth-url:
    get:
      description: Retorna a URL de autorização OAuth para iniciar a conexão do workspace
        com o Google Agenda.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.AuthURLResponse'
      security:
      - BearerAuth: []
      summary: Obter a URL de autorização do Google Agenda
      tags:
      - Agenda
  /calendar/google/callback:
    get:
      description: Endpoint público que recebe o retorno do fluxo OAuth do Google
        Agenda e redireciona o usuário de volta ao painel de integrações.
      parameters:
      - description: Código de autorização retornado pelo Google
        in: query
        name: code
        type: string
      - description: Estado assinado gerado ao iniciar o fluxo
        in: query
        name: state
        type: string
      - description: Erro retornado pelo Google, quando houver
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redireciona para o painel de integrações
          schema:
            type: string
      summary: Callback de autorização do Google Agenda
      tags:
      - Agenda
  /calendar/google/connect:
    post:
      consumes:
      - application/json
      description: Conclui a conexão com o Google Agenda trocando o código de autorização
        OAuth pelas credenciais de acesso do workspace.
      parameters:
      - description: Código de autorização OAuth
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/calendar.ConnectGoogleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.ConnectionEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Conectar o Google Agenda
      tags:
      - Agenda
  /calendar/google/disconnect:
    delete:
      description: Remove a conexão com o Google Agenda do workspace.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.DisconnectedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Desconectar o Google Agenda
      tags:
      - Agenda
  /calendar/google/status:
    get:
      description: Retorna o status da conexão do workspace com o Google Agenda.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.ConnectionStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar a conexão com o Google Agenda
      tags:
      - Agenda
  /calendar/google/watch:
    delete:
      description: Cancela o canal de notificações de sincronização do Google Agenda
        do workspace.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.StoppedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Encerrar o monitoramento do Google Agenda
      tags:
      - Agenda
    post:
      description: Registra um canal de notificações para sincronizar automaticamente
        as alterações do Google Agenda.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.WatchEnvelope'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Iniciar o monitoramento do Google Agenda
      tags:
      - Agenda
  /call-billing:
    get:
      description: Retorna o histórico paginado de cobranças de chamadas (transcrição,
        voz, IA e telefonia) do workspace, com filtros opcionais por status, origem
        e período.
      parameters:
      - description: Número da página (inicia em 1)
        in: query
        name: page
        type: integer
      - description: Quantidade de itens por página
        in: query
        name: pageSize
        type: integer
      - description: Filtrar por status da cobrança
        in: query
        name: status
        type: string
      - description: Filtrar por origem da chamada
        in: query
        name: callSource
        type: string
      - description: Data inicial no formato RFC3339
        in: query
        name: startDate
        type: string
      - description: Data final no formato RFC3339
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callbilling.CallBillingListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar cobranças de chamadas
      tags:
      - Cobrança de chamadas
  /call-queues:
    get:
      description: Lista as filas telefônicas do workspace com quem atende cada uma
        e a música de espera.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/callrouting.QueueResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar filas de atendimento
      tags:
      - Filas de atendimento
    post:
      consumes:
      - application/json
      description: Cria uma fila telefônica no workspace. Quem atende vem de um departamento
        ou de uma lista de pessoas do workspace, nunca dos dois. A estratégia padrão
        entrega a ligação a quem está livre há mais tempo (longest_idle); round_robin
        reveza a partir do último chamado, fewest_calls prioriza quem atendeu menos
        e random sorteia. Sem música informada, a fila usa o preset padrão.
      parameters:
      - description: Dados da fila
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/callrouting.QueueRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/callrouting.QueueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar fila de atendimento
      tags:
      - Filas de atendimento
  /call-queues/{id}:
    delete:
      description: Remove uma fila telefônica do workspace. Fluxos de voz que enviam
        ligações a ela passam a seguir a saída de tempo esgotado.
      parameters:
      - description: ID da fila
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callrouting.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover fila de atendimento
      tags:
      - Filas de atendimento
    get:
      description: Retorna uma fila telefônica do workspace.
      parameters:
      - description: ID da fila
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callrouting.QueueResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obter fila de atendimento
      tags:
      - Filas de atendimento
    put:
      consumes:
      - application/json
      description: Substitui a configuração de uma fila telefônica do workspace. Quem
        já está esperando continua na fila e passa a seguir a configuração nova na
        próxima tentativa.
      parameters:
      - description: ID da fila
        in: path
        name: id
        required: true
        type: string
      - description: Configuração completa da fila
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/callrouting.QueueRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callrouting.QueueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar fila de atendimento
      tags:
      - Filas de atendimento
  /call-queues/live:
    get:
      description: 'Mostra, em cada fila, quem está esperando e há quanto tempo, e
        o estado de cada atendente: livre, tocando, em ligação, em pausa após a ligação
        ou fora (discador fechado ou sem permissão para atender). Os números vêm da
        memória do servidor e mudam a cada ligação; consulte de novo para acompanhar.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/callrouting.QueueLiveResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Filas ao vivo
      tags:
      - Filas de atendimento
  /call-queues/stats:
    get:
      description: 'Para cada fila, no período informado (até 31 dias): ligações recebidas,
        atendidas, abandonadas por quem ligou e que esgotaram o tempo, espera média
        até o atendimento e nível de serviço (fração das ligações atendidas em até
        20 segundos).'
      parameters:
      - description: Início do período (RFC 3339 ou AAAA-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: Fim do período (RFC 3339 ou AAAA-MM-DD, inclusivo)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/callrouting.QueueStatsResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Números das filas no período
      tags:
      - Filas de atendimento
  /call-queues/transfer-targets:
    get:
      description: Lista as filas para onde quem está em uma ligação (tronco SIP ou
        WhatsApp) pode transferi-la, com quantas pessoas esperam e quantos atendentes
        estão livres agora. Os colegas disponíveis chegam pela presença do WebSocket
        de sessão de chamada; a transferência é feita pelo evento call:transfer.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/callrouting.QueueTargetResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Filas para transferência
      tags:
      - Filas de atendimento
  /call-recordings/by-entry:
    get:
      description: Retorna as gravações de chamadas associadas a uma entrada de campanha
        do workspace autenticado.
      parameters:
      - description: ID da entrada de campanha
        in: query
        name: entryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callrecording.CallRecordingCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar gravações de chamadas por entrada de campanha
      tags:
      - Gravações de chamadas
  /call-routing/settings:
    get:
      description: Retorna a música tocada para quem espera uma transferência direta
        para um colega. Cada fila tem a sua própria música.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callrouting.SettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Música de espera do workspace
      tags:
      - Filas de atendimento
    put:
      consumes:
      - application/json
      description: 'Define a música de espera das transferências diretas: um preset
        ou um áudio enviado à biblioteca de mídia que possa tocar em ligações. Sem
        música informada, volta ao preset padrão.'
      parameters:
      - description: Música de espera
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/callrouting.SettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callrouting.SettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Definir música de espera do workspace
      tags:
      - Filas de atendimento
  /calls:
    get:
      description: 'Lista as ligações do workspace, das mais recentes para as mais
        antigas, por tronco SIP e WhatsApp: quem ligou, quem atendeu, quantas transferências
        houve, o resultado, o tempo de conversa e o valor cobrado. Sem a permissão
        `call_history:view_others`, a lista traz só as ligações de que você participou
        (fez, atendeu, transferiu ou recebeu por transferência) e `memberId` é ignorado.
        `amountMicros` é o valor debitado do saldo, em milionésimos de real.'
      parameters:
      - description: Página (começa em 1)
        in: query
        name: page
        type: integer
      - description: Itens por página (máximo 100)
        in: query
        name: pageSize
        type: integer
      - description: Direção
        enum:
        - inbound
        - outbound
        in: query
        name: direction
        type: string
      - description: Canal
        enum:
        - phone
        - whatsapp
        in: query
        name: channel
        type: string
      - description: Atendida ou não
        enum:
        - answered
        - unanswered
        in: query
        name: result
        type: string
      - description: Ligações de que este membro participou (exige call_history:view_others)
        in: query
        name: memberId
        type: string
      - description: Início do período (YYYY-MM-DD ou RFC 3339)
        in: query
        name: from
        type: string
      - description: Fim do período (YYYY-MM-DD inclui o dia todo, ou RFC 3339)
        in: query
        name: to
        type: string
      - description: Parte do número do contato
        in: query
        name: number
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callhistory.CallListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar chamadas
      tags:
      - Histórico de chamadas
  /calls/{callId}:
    get:
      description: Mostra uma ligação com quem participou, a linha do tempo (início,
        atendimento, cada transferência e o que aconteceu com ela, fim) e a gravação.
        A gravação só aparece para quem tem `call_recordings:read`. Uma ligação de
        que você não participou, sem `call_history:view_others`, responde 404.
      parameters:
      - description: Identificador da ligação
        in: path
        name: callId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callhistory.CallDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detalhar chamada
      tags:
      - Histórico de chamadas
  /cep/search:
    get:
      description: Retorna o endereço (logradouro, bairro, cidade e UF) correspondente
