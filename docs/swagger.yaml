        name: page
        type: integer
      - description: Quantidade de itens por página
        in: query
        name: pageSize
        type: integer
      - description: Busca textual por título ou descrição
        in: query
        name: search
        type: string
      - description: Data inicial no formato RFC3339
        in: query
        name: from
        type: string
      - description: Data final no formato RFC3339
        in: query
        name: to
