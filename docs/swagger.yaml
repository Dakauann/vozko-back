  workspace_config.UpdateWorkspaceConfigOwnerInput:
    properties:
      autoCloseEnabled:
        description: Conversation auto-close policy (nil = not sent).
        type: boolean
      autoCloseIdleAfterHours:
        type: integer
      autoCloseMaxAgeAfterHours:
        type: integer
      autoCloseMaxAgeEnabled:
        description: Absolute inactivity max-age (nil = not sent).
        type: boolean
      holdMusicTrack:
        description: |-
          HoldMusicTrack: pointer distinguishes "not sent" from "clear" (empty string
          resets to the system default).
        type: string
      queueEnabled:
        description: 'Queue policy (all pointers: nil = not sent, so a partial update
          is safe).'
        type: boolean
      queueMaxLength:
        type: integer
      queueMaxWaitSeconds:
        type: integer
      queueOverflow:
        type: string
      skipAdminAssignment:
        type: boolean
    type: object
  workspace_plan.BillingCycle:
    enum:
