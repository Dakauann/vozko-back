        in: query
        name: since
        type: string
      - description: YYYY-MM-DD
        in: query
        name: until
        type: string
      - description: IDs de campanha separados por vírgula
        in: query
        name: campaignIds
        type: string
      - description: IDs de conjunto separados por vírgula
        in: query
        name: adSetIds
        type: string
      - description: só estes itens (IDs na Meta separados por vírgula)
        in: query
        name: objectIds
        type: string
      - description: busca por nome
        in: query
        name: search
        type: string
