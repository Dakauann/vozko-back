          description: O workflow já possui um webhook
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Criar o gatilho de webhook de um workflow
      tags:
      - workflows
    put:
      consumes:
      - application/json
      description: Atualiza o modo de autenticação, o método HTTP aceito ou o estado
        ativo do webhook. A URL e o token são preservados.
      parameters:
      - description: ID do workflow
        in: path
        name: id
        required: true
        type: string
      - description: Configuração do webhook
        in: body
        name: body
        required: true
        schema:
