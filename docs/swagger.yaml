  /leads:
    get:
      description: Retorna a lista paginada de leads do workspace. Aceita os filtros
        simples por querystring (nome, número, período, faixa etária, campanha, canal,
        bloqueio, janela, memórias) e/ou um filtro estruturado `filter` (crmfilter
        em JSON, opcionalmente em base64) com grupos AND/OR. A ordenação aceita múltiplas
        chaves.
      parameters:
      - description: Número da página (inicia em 1)
        in: query
        name: page
        type: integer
      - description: Itens por página (máximo 200)
        in: query
        name: pageSize
        type: integer
      - description: 'Ordenação: createdAt, updatedAt, lastActivityAt, name, number,
          age, campaigns, memories, lastMemoryAt (ex.: lastActivityAt:desc,name:asc)'
        in: query
        name: sort
        type: string
      - description: Direção padrão quando o sort não a informa ('asc' ou 'desc')
        in: query
        name: order
        type: string
      - description: Filtro crmfilter em JSON (opcionalmente codificado em base64)
        in: query
        name: filter
        type: string
      - description: Busca livre por nome, número ou conteúdo das memórias
        in: query
        name: q
        type: string
      - description: Filtrar por número de telefone
        in: query
        name: number
        type: string
      - description: Filtrar por nome
        in: query
        name: name
        type: string
      - description: Possui nome preenchido
        in: query
        name: hasName
        type: boolean
      - description: Idade mínima
        in: query
        name: ageFrom
        type: integer
      - description: Idade máxima
        in: query
        name: ageTo
        type: integer
      - description: Somente bloqueados / não bloqueados
        in: query
