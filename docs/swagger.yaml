      - Mensagens Agendadas
  /scheduled-messages/{id}:
    delete:
      description: Cancela uma mensagem ainda pendente. Uma mensagem já enviada não
        pode ser cancelada — o cliente já a recebeu.
      parameters:
      - description: ID da mensagem agendada
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Cancelada
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: A mensagem já foi enviada ou já não está pendente
          schema:
            $ref: '#/definitions/response.ErrorResponse'
