  /conversations/{entryType}/{entryId}/automation:
    patch:
      consumes:
      - application/json
      description: Liga ou desliga o atendimento automático desta conversa. Envie
        null para voltar a herdar a configuração da conta/campanha. Desligar devolve
        para a fila da equipe uma conversa que a IA ou o fluxo detinha; ligar (ou
        null) devolve a conversa para a IA ou o fluxo que atende o canal. Se o canal
        não tiver agente ou fluxo ativo, a automação continua pausada e a resposta
        é 409 com code nothing_to_return_to, para que a IA nunca responda uma conversa
        que está com uma pessoa. A resposta traz o responsável resultante em assigned_user_id.
      parameters:
      - description: Tipo da entrada
        in: path
        name: entryType
        required: true
        type: string
      - description: ID da entrada
        in: path
        name: entryId
        required: true
        type: string
      - description: Novo estado
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/conversation.SetAutomationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Ativar/desativar automação de uma conversa
      tags:
      - Conversas
  /conversations/{entryType}/{entryId}/call-permission:
    get:
      description: Informa se o cliente da conversa permite atualmente ligações pelo
        WhatsApp, para que o cliente possa habilitar ou não a ação de ligar.
      parameters:
      - description: Tipo da entrada (whatsapp, unofficial_whatsapp, instagram ou
