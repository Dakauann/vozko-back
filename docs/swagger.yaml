  workspaceconfig.WorkspaceConfigResponse:
    properties:
      autoCloseEnabled:
        example: true
        type: boolean
      autoCloseIdleAfterHours:
        example: 24
        type: integer
      autoCloseMaxAgeAfterHours:
        example: 168
        type: integer
      autoCloseMaxAgeEnabled:
        example: true
        type: boolean
      campaignSpamProtectionDays:
        example: 3
        type: integer
      createdAt:
        type: string
      holdMusicTrack:
        example: builtin:bossa_nova
        type: string
      id:
        example: cfg_a1b2c3
        type: string
      includedUnofficialWhatsAppInstances:
        description: |-
          IncludedUnofficialWhatsAppInstances is the platform-granted allowance of
          linked-device WhatsApp numbers. Readable by the workspace so its own
          screens can explain why the connect button is disabled; writable only
          through the /admin route.
        example: 2
        type: integer
      queueEnabled:
        example: true
        type: boolean
      queueMaxLength:
        example: 10
        type: integer
      queueMaxWaitSeconds:
        example: 120
        type: integer
      queueOverflow:
        example: recall
        type: string
      skipAdminAssignment:
        example: false
        type: boolean
      updatedAt:
        type: string
      updatedBy:
        example: usr_a1b2c3
        type: string
      workspaceId:
        example: ws_a1b2c3
        type: string
    type: object
  workspacedepartment.AddMemberRequest:
    properties:
      memberId:
        example: mem_a1b2c3
        type: string
    type: object
  workspacedepartment.CreateDepartmentRequest:
    properties:
      description:
        example: Equipe de atendimento ao cliente
        type: string
      name:
        example: Suporte
        type: string
    type: object
  workspacedepartment.DepartmentMemberResponse:
    properties:
      createdAt:
        type: string
      departmentId:
        example: dept_a1b2c3
        type: string
      email:
        example: maria@empresa.com.br
        type: string
      id:
        example: dm_a1b2c3
        type: string
      memberId:
        example: mem_a1b2c3
        type: string
      role:
        example: agent
        type: string
      userId:
        example: usr_a1b2c3
        type: string
      username:
        example: Maria Silva
        type: string
    type: object
  workspacedepartment.DepartmentResponse:
    properties:
      createdAt:
        type: string
      description:
        example: Equipe de atendimento ao cliente
        type: string
      id:
        example: dept_a1b2c3
        type: string
      memberCount:
        example: 5
        type: integer
      name:
        example: Suporte
        type: string
      updatedAt:
        type: string
      workspaceId:
        example: ws_a1b2c3
        type: string
    type: object
  workspacedepartment.UpdateDepartmentRequest:
    properties:
      description:
        example: Equipe de atendimento ao cliente
        type: string
      name:
        example: Suporte
        type: string
    type: object
  workspacepricing.PublicExchangeRateResponse:
    properties:
      currency:
        example: BRL
        type: string
      priceMicros:
        example: 6000000
        type: integer
    type: object
info:
  contact: {}
  description: API de comunicação omnichannel e call center.
  title: API
  version: "1.0"
paths:
  /affiliate/earnings:
    get:
      description: Retorna a lista paginada de comissões registradas para o afiliado
        autenticado.
      parameters:
      - description: Número da página (inicia em 1)
        in: query
        name: page
        type: integer
      - description: Quantidade de itens por página
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/affiliate.EarningListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar meus ganhos
      tags:
      - Afiliados
  /affiliate/me:
    get:
      description: Retorna o perfil de afiliado do usuário autenticado, incluindo
        os totais de indicações e ganhos acumulados.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/affiliate.AffiliateProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar meu perfil de afiliado
      tags:
      - Afiliados
    put:
      consumes:
      - application/json
      description: Atualiza os dados da marca e a carteira Asaas do afiliado autenticado.
        Todos os campos são opcionais.
      parameters:
      - description: Campos do perfil a atualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/affiliate.UpdateAffiliateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/affiliate.AffiliateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar meu perfil de afiliado
      tags:
      - Afiliados
  /affiliate/referrals:
    get:
      description: Retorna a lista paginada de workspaces indicados pelo afiliado
        autenticado.
      parameters:
      - description: Número da página (inicia em 1)
        in: query
        name: page
        type: integer
      - description: Quantidade de itens por página
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/affiliate.ReferralListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar minhas indicações
      tags:
      - Afiliados
  /affiliate/register:
    post:
      consumes:
      - application/json
      description: Registra o usuário autenticado como afiliado, criando sua marca
        e vinculando a carteira Asaas que receberá as comissões das indicações.
      parameters:
      - description: Dados de cadastro do afiliado
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/affiliate.RegisterAffiliateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/affiliate.AffiliateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tornar-se um afiliado
      tags:
      - Afiliados
  /affiliate/validate/{code}:
    get:
      description: Verifica se um código de indicação existe e está ativo, retornando
        os dados públicos da marca do afiliado para exibição no cadastro.
      parameters:
      - description: Código de indicação a validar
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/affiliate.ReferralValidationResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Validar um código de indicação
      tags:
      - Afiliados
  /analysis:
    get:
      description: Retorna as análises de conversas e chamadas do workspace do usuário.
        Aceita filtros por campanha, lead, tipo de entrada, interesse, disposição,
        sentimento, qualificação, próxima ação e faixas de qualidade de atendimento
        e de número de mensagens, além de paginação e ordenação.
      parameters:
      - description: ID da campanha de voz
        in: query
        name: campaignId
        type: string
      - description: ID da campanha de WhatsApp
        in: query
        name: whatsappCampaignId
        type: string
      - description: ID do lead
        in: query
        name: leadId
        type: string
      - description: Tipo de entrada ('voice' ou 'whatsapp')
        in: query
        name: entryType
        type: string
      - description: Filtro por interesse
        in: query
        name: interest
        type: string
      - description: Filtro por disposição
        in: query
        name: disposition
        type: string
      - description: Filtro por sentimento
        in: query
        name: sentiment
        type: string
      - description: Filtro por qualificação
        in: query
        name: qualification
        type: string
      - description: Filtro por próxima ação
        in: query
        name: nextAction
        type: string
      - description: Qualidade mínima de atendimento
        in: query
        name: attendanceQualityMin
        type: integer
      - description: Qualidade máxima de atendimento
        in: query
        name: attendanceQualityMax
        type: integer
      - description: Número mínimo de mensagens
        in: query
        name: messageCountMin
        type: integer
      - description: Número máximo de mensagens
        in: query
        name: messageCountMax
        type: integer
      - description: Número da página
        in: query
        name: page
        type: integer
      - description: Tamanho da página
        in: query
        name: pageSize
        type: integer
      - description: 'Ordenação (ex.: createdAt:desc)'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/analysis.Analysis'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar análises
      tags:
      - Análises
  /analysis/entry/{entryId}:
    get:
      description: Retorna a análise mais recente de uma conversa ou chamada específica,
        identificada pelo ID da entrada e pelo tipo ('voice' ou 'whatsapp').
      parameters:
      - description: ID da entrada
        in: path
        name: entryId
        required: true
        type: string
      - description: Tipo da entrada ('voice' ou 'whatsapp')
        in: query
        name: entryType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analysis.Analysis'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obter análise de uma entrada
      tags:
      - Análises
  /analysis/stats:
    get:
      description: Retorna estatísticas agregadas das análises do workspace do usuário,
        como médias de qualidade de atendimento e contagens por interesse, disposição,
        sentimento e qualificação, aplicando os mesmos filtros da listagem.
      parameters:
      - description: ID da campanha de voz
        in: query
        name: campaignId
        type: string
      - description: ID da campanha de WhatsApp
        in: query
        name: whatsappCampaignId
        type: string
      - description: ID do lead
        in: query
        name: leadId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analysis.AnalysisStats'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Estatísticas de análises
      tags:
      - Análises
  /attendance/ai-stats:
    get:
      description: Retorna as métricas de atendimento dos agentes de IA do workspace
        (sessões, contenção, transbordo e abandono), com filtro opcional por período
        e campanha.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: ID da campanha
        in: query
        name: campaign_id
        type: string
      - description: Tipo da campanha
        in: query
        name: campaign_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/attendance.AIAgentStats'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Estatísticas de agentes de IA
      tags:
      - Atendimento
  /attendance/frt:
    get:
      description: Retorna as métricas de tempo de primeira resposta do workspace
        (médio, mediano e por origem humana ou IA), com filtro opcional por período
        e campanha.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: ID da campanha
        in: query
        name: campaign_id
        type: string
      - description: Tipo da campanha
        in: query
        name: campaign_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/attendance.FRTStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tempo de primeira resposta (FRT)
      tags:
      - Atendimento
  /attendance/occupancy:
    get:
      description: Retorna a ocupação dos atendentes do workspace (tempo em chamada
        sobre tempo online) no período informado.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agent_presence.OccupancyRow'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ocupação dos atendentes
      tags:
      - Atendimento
  /attendance/overview:
    get:
      description: Retorna o painel operacional filtrável do workspace (KPIs, distribuição
        por hora, por departamento e por equipe), com filtros opcionais por período,
        departamento, membro, campanha e canal.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: ID do departamento
        in: query
        name: department_id
        type: string
      - description: ID do membro
        in: query
        name: member_id
        type: string
      - description: ID da campanha
        in: query
        name: campaign_id
        type: string
      - description: Tipo da campanha
        in: query
        name: campaign_type
        type: string
      - description: Canal de atendimento
        in: query
        name: channel
        type: string
      - description: 'Incluir agentes de IA (padrão: true)'
        in: query
        name: include_ai
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/attendance.Overview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Visão geral de atendimento
      tags:
      - Atendimento
  /attendance/queue-stats:
    get:
      description: Retorna as métricas de fila de atendimento do workspace (aguardando,
        atendidas e tempo de espera), com filtro opcional por período.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queue_event.Stats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Estatísticas de fila
      tags:
      - Atendimento
  /attendance/response-times:
    get:
      description: Retorna a distribuição das conversas do workspace por faixa de
        tempo de resposta, com filtro opcional por período e campanha.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: ID da campanha
        in: query
        name: campaign_id
        type: string
      - description: Tipo da campanha
        in: query
        name: campaign_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/attendance.ResponseTimeDistribution'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Distribuição de tempo de resposta
      tags:
      - Atendimento
  /attendance/stats:
    get:
      description: Retorna as métricas de atendimento por atendente do workspace (atribuídos,
        respondidos, taxa de resposta e tempo médio de resposta), com filtro opcional
        por período e campanha.
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: ID da campanha
        in: query
        name: campaign_id
        type: string
