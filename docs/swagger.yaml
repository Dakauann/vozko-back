      description: Coloca na fila a exportacao em CSV dos leads de TODAS as campanhas
        do workspace de uma só vez, no mesmo recorte do resumo de disparos (período
        de criação da campanha, tipo e departamento). Use status para escolher os
        envios desejados — por exemplo status=SENT,DELIVERED,READ para os leads que
        foram enviados, entregues e lidos. Sem status, retorna todos. O arquivo inclui
        uma coluna campaign identificando a origem de cada linha e BOM UTF-8 para
        abertura correta no Excel.
