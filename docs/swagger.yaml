  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Autentica um usuário com credenciais e retorna um par de tokens
        de acesso e atualização. Clientes SPA de navegador que enviam `X-Auth-Mode:
        cookie` recebem os tokens como cookies httpOnly e os campos de token são omitidos
        do corpo.'
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: AUTH_INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: AUTH_RATE_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
