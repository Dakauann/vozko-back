  /sip-trunks:
    get:
      description: Lista os troncos SIP do workspace com o estado atual da registração
        no provedor. A senha nunca é devolvida, apenas se há uma cadastrada.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/siptrunk.TrunkResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar troncos SIP
      tags:
      - Troncos SIP
    post:
      consumes:
      - application/json
      description: Cadastra um tronco SIP no workspace. Troncos habilitados passam
        a se registrar no provedor e a registração é mantida e renovada antes de expirar,
        sem depender de chamadas. É preciso ao menos um codec G.711 (PCMU ou PCMA).
      parameters:
      - description: Dados do tronco a cadastrar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/siptrunk.CreateTrunkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
