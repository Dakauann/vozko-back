      tags:
      - Mensagens Agendadas
    patch:
      consumes:
      - application/json
      description: Altera o horário de uma mensagem ainda pendente. O novo horário
        é validado contra a janela de atendimento como ela está agora.
      parameters:
      - description: ID da mensagem agendada
        in: path
        name: id
        required: true
        type: string
      - description: Novo horário
        in: body
