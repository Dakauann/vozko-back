      summary: Consultar permissão para ligar
      tags:
      - Conversas
  /conversations/{entryType}/{entryId}/call-permission-request:
    post:
      consumes:
      - application/json
      description: Solicita ao cliente permissão para receber ligações pelo WhatsApp
        na conversa informada. A janela de 24 horas precisa estar aberta ou um modelo
        (template) é exigido.
      parameters:
      - description: Tipo da entrada (whatsapp, unofficial_whatsapp, instagram ou
          telegram)
        in: path
        name: entryType
        required: true
        type: string
      - description: ID da entrada
        in: path
        name: entryId
        required: true
        type: string
      - description: Texto opcional da solicitação
        in: body
        name: request
        schema:
          $ref: '#/definitions/conversation.CallPermissionRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.MessageEnvelopeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "501":
