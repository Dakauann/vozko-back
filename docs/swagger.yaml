    get:
      description: Lista as chamadas em andamento por um tronco SIP do workspace.
        Chamadas são iniciadas pelo WebSocket de sessão de chamada (evento call:start
        com trunk_id), que aplica a reserva de saldo e a cobrança por minuto; não
        há rota HTTP para iniciar chamadas.
