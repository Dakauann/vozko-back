  /ads/accounts/{id}/readiness:
    get:
      description: 'Lista ordenada do que a conta precisa para publicar, como na Meta:
        conexão, função de anunciante, status, moeda e fuso, forma de pagamento, página,
        verificações de telefone e email, termos de públicos personalizados e pixel.
        Cada item vem ready, missing ou unknown; unknown nunca conta como pronto.
        Itens com required true bloqueiam a publicação e aparecem em blocking. A ação
        de um item é in_app (reconnect, sync, create_pixel, feitas no Vozko) ou portal
        (url da tela exata da Meta, quando a API não permite), sempre com o negócio
        dono da conta (business_id) e a própria conta; quando não dá para apontar
        a tela daquela conta, o item vem sem ação. Telefone e email não têm leitura
        na API e vêm sempre unknown, sem bloquear. billing traz o saldo devido e o
        tipo de cobrança para quem anuncia na conta, e a forma de pagamento só para
        administradores da conta.'
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.ReadinessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Prontidão da conta para veicular anúncios
      tags:
      - Anúncios
