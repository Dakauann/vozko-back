      consumes:
      - application/json
      description: Registra um fato sobre o lead. Um conteúdo equivalente a uma memória
        já existente devolve a memória existente (200) em vez de criar uma duplicata.
      parameters:
      - description: ID do lead
        in: path
        name: id
