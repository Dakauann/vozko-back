      leadName:
        type: string
      leadNumber:
        type: string
      matchedMessages:
        items:
          $ref: '#/definitions/conversation.MatchedMessageResult'
        type: array
      mediaType:
        $ref: '#/definitions/conversation.MediaType'
      totalMatches:
        type: integer
      unreadCount:
        format: int64
        type: integer
      workflowEnabled:
        type: boolean
      workflowID:
        type: string
    type: object
