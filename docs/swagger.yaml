      consumes:
      - application/json
      description: Cria a URL pública que sistemas externos usam para iniciar este
        workflow. Retorna a URL e, uma única vez, o segredo quando o modo de autenticação
        exige. Um workflow só pode ter um webhook.
      parameters:
      - description: ID do workflow
        in: path
        name: id
        required: true
        type: string
      - description: Configuração do webhook
        in: body
        name: body
