        type: string
      rouletteRescueAfterMinutes:
        example: 15
        type: integer
      rouletteRescueEnabled:
        example: true
        type: boolean
      skipAdminAssignment:
        example: false
        type: boolean
      updatedAt:
        type: string
      updatedBy:
        example: usr_a1b2c3
