    - cancelled
    - expired
    type: string
    x-enum-varnames:
    - SubscriptionStatusActive
    - SubscriptionStatusCancelled
    - SubscriptionStatusExpired
  workspaceaddon.customerAddonDefinition:
    properties:
      annualPriceMicros:
        type: integer
      archivedAt:
        type: string
      createdAt:
        type: string
      description:
        type: string
      entitlementKind:
