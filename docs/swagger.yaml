      - Agenda
    get:
      description: Retorna os detalhes de um evento da agenda a partir do seu identificador.
      parameters:
      - description: Identificador do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.EventEnvelope'
        "404":
