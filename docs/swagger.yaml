        required: true
        type: string
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: date_from
        required: true
        type: string
      - description: Data final (YYYY-MM-DD), no máximo 92 dias após a inicial
        in: query
        name: date_to
        required: true
        type: string
      - description: ID da campanha
        in: query
        name: campaign_id
        type: string
      - description: ID do departamento (sem campaign_id)
        in: query
        name: department_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
