        montados exatamente como em produção. Ferramentas de leitura pura (busca na
        base de conhecimento, consulta de disponibilidade, CEP, HTTP GET) executam
        de verdade; qualquer ferramenta que possa alterar algo é interceptada e nenhuma
        ação real acontece. Retorna as respostas do agente, as chamadas de ferramenta
        (com argumentos e o campo `stubbed`) e o raio-X do turno para depuração. Consome
        créditos de IA normalmente.'
