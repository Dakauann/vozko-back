            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar um funil
      tags:
      - Funis
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um funil existente. Apenas os campos enviados
        são alterados.
      parameters:
      - description: Identificador do funil
        in: path
        name: id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pipeline.UpdatePipelineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pipeline.PipelineResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar um funil
      tags:
      - Funis
  /pipelines/{id}/usage:
    get:
      description: Retorna quantas conversas, campanhas, canais e oportunidades ainda
        apontam para o funil, para que a exclusão seja confirmada com os números à
        vista.
      parameters:
      - description: Identificador do funil
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pipeline.Usage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar o que um funil contém
      tags:
      - Funis
  /pricing/exchange-rate:
    get:
      description: Retorna a cotação atual do dólar (USD) para o real (BRL) utilizada
        nos cálculos de preços e cobranças do workspace.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/workspacepricing.PublicExchangeRateResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar a cotação do dólar
      tags:
      - Preços
  /public/webchat/{publicKey}/challenge:
    post:
      consumes:
      - application/json
      description: Devolve um desafio de prova de trabalho (SHA-256 com bits zerados
        no início) que o chat resolve antes de abrir uma sessão anônima. Vale 2 minutos
        e uma única vez. Só responde à janela do chat (mesma origem).
      parameters:
      - description: chave pública do chat
        in: path
        name: publicKey
        required: true
        type: string
      - description: origem do site onde o chat está
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webchat.ChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webchat.ChallengeResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
      summary: Desafio anti-robô do WebChat
      tags:
      - WebChat
  /public/webchat/{publicKey}/frame:
    get:
      description: Página do chat carregada pelo script dentro de um iframe. Só pode
        ser exibida nos sites permitidos do chat (Content-Security-Policy frame-ancestors).
        Chat pausado ou removido responde 404.
      parameters:
      - description: chave pública do chat
        in: path
        name: publicKey
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
      summary: Janela do WebChat
      tags:
      - WebChat
  /public/webchat/{publicKey}/session:
    post:
      consumes:
      - application/json
      description: 'Abre ou retoma a sessão de um visitante. Com token válido retoma
        o mesmo visitante; sem ele exige o desafio resolvido (challengeToken e nonce).
        Com identity (JWT assinado pelo site) o visitante é o cliente identificado,
        em qualquer aparelho. Devolve o token da sessão (30 dias, enviado como Authorization:
        Bearer), a aparência do chat e o que falta no formulário inicial. Limites:
        novas sessões por IP e por chat (429 rate_limited).'
      parameters:
      - description: chave pública do chat
        in: path
        name: publicKey
        required: true
        type: string
      - description: token, desafio ou identidade
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webchat.SessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webchat.SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
      summary: Abrir sessão do visitante
      tags:
      - WebChat
  /public/webchat/assets/{file}:
    get:
      description: JavaScript e CSS da janela do chat.
      parameters:
      - description: frame.js ou frame.css
        in: path
        name: file
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
      summary: Arquivos do WebChat
      tags:
      - WebChat
  /public/webchat/loader.js:
    get:
      description: 'Script que o site inclui com <script async src=".../public/webchat/loader.js"
        data-key="CHAVE_PUBLICA">. Desenha o botão e abre o chat num iframe servido
        por esta API. Para identificar um cliente logado, defina antes window.VozkoChat
        = { identity: "<JWT HS256 gerado no seu servidor>" }.'
      produces:
      - application/javascript
      responses:
        "200":
          description: OK
      summary: Script do WebChat
      tags:
      - WebChat
  /public/webchat/session/handoff:
    post:
      description: 'Disponível quando o chat oferece falar com uma pessoa: pausa o
        agente ou fluxo e passa a conversa para a fila do departamento do chat.'
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
      security:
      - BearerAuth: []
      summary: Pedir atendimento humano
      tags:
      - WebChat
  /public/webchat/session/intake:
    post:
      consumes:
      - application/json
      description: Nome, e-mail, telefone e aceite da política de privacidade, conforme
        o chat pede. Um telefone liga o visitante ao lead com o mesmo número. O campo
        website precisa ficar vazio.
      parameters:
      - description: respostas
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webchat.IntakeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webchat.VisitorStateResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
      security:
      - BearerAuth: []
      summary: Enviar formulário inicial
      tags:
      - WebChat
  /public/webchat/session/media:
    post:
      consumes:
      - multipart/form-data
      description: 'multipart/form-data com file, clientMessageId e pageUrl. Só quando
        o chat aceita anexos: JPEG, PNG, WebP, GIF ou PDF, até 10 MB. O tipo é conferido
        pelo conteúdo, não pelo nome.'
      parameters:
      - description: arquivo
        in: formData
        name: file
        required: true
        type: file
      - description: id do envio
        in: formData
        name: clientMessageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/webchat.MessageResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
      security:
      - BearerAuth: []
      summary: Enviar arquivo do visitante
      tags:
      - WebChat
  /public/webchat/session/messages:
    get:
      description: Mensagens da conversa do visitante, da mais antiga à mais nova,
        só com o que o cliente pode ver (sem notas internas, ferramentas ou dados
        de atendentes). before e after (RFC 3339) paginam; options são os botões ainda
        em aberto.
      parameters:
      - description: mensagens antes deste instante
        in: query
        name: before
        type: string
      - description: mensagens depois deste instante
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webchat.HistoryResponse'
      security:
      - BearerAuth: []
      summary: Histórico do visitante
      tags:
      - WebChat
    post:
      consumes:
      - application/json
      description: 'Texto (até 2.000 caracteres) ou a escolha de um botão oferecido
        (selectionId). clientMessageId (8 a 64 caracteres) torna o envio idempotente:
        repetir o mesmo id não duplica a mensagem nem a resposta automática. O agente
        ou fluxo do chat responde pela sessão em tempo real. Limites por visitante
        e por IP (429 rate_limited).'
      parameters:
      - description: mensagem
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webchat.MessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/webchat.MessageResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
      security:
      - BearerAuth: []
      summary: Enviar mensagem do visitante
      tags:
      - WebChat
  /public/webchat/session/stream:
    get:
      description: |-
        Server-Sent Events lidos com fetch (o token vai no cabeçalho Authorization, nunca na URL).

        | evento | dados |
        |---|---|
        | message | { kind: "message", message: { id, author: visitor, team ou assistant, text, media, options, createdAt } } |
        | typing | { kind: "typing", typing } |
        | status | { kind: "status", state: human ou blocked } |
        | ping | a cada 20 s |

        A conexão fecha depois de 30 minutos; o chat reconecta e busca o que perdeu com GET .../messages?after=. No máximo 3 conexões por visitante (429).
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.CodedErrorResponse'
      security:
      - BearerAuth: []
      summary: Eventos em tempo real do visitante
      tags:
      - WebChat
  /public/webchat/session/typing:
    post:
      consumes:
      - application/json
      description: Mostra aos atendentes que o visitante está digitando.
      parameters:
      - description: digitando ou não
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webchat.TypingRequest'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Visitante digitando
      tags:
      - WebChat
  /r/{code}:
    get:
      description: Resolve o código público e redireciona para a URL de destino, exibe
        a página de senha quando o link é protegido, ou retorna 404. O clique é contabilizado
        de forma assíncrona.
      parameters:
      - description: Código do link curto
        in: path
        name: code
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Página de senha (link protegido)
          schema:
            type: string
        "302":
          description: Redirecionamento para a URL de destino
        "404":
          description: Link não encontrado ou expirado
          schema:
            type: string
      summary: Redirecionar um link curto
      tags:
      - Links Curtos
  /r/{code}/unlock:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Valida a senha de um link protegido e redireciona para a URL de
        destino em caso de sucesso. Se a senha estiver incorreta, reexibe a página
        de senha.
      parameters:
      - description: Código do link curto
        in: path
        name: code
        required: true
        type: string
      - description: Senha do link
        in: formData
        name: password
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirecionamento para a URL de destino
        "401":
          description: Senha incorreta
          schema:
            type: string
        "404":
          description: Link não encontrado
          schema:
            type: string
      summary: Desbloquear um link curto protegido por senha
      tags:
      - Links Curtos
  /reports:
    get:
      description: Lista os relatórios solicitados recentemente pelo workspace, do
        mais novo para o mais antigo.
      parameters:
      - description: Quantidade máxima (padrão 25, teto 100)
        in: query
        name: limit
        type: integer
      - description: Deslocamento para paginação
        in: query
        name: offset
        type: integer
      - description: Filtrar por tipo (aceita lista separada por vírgula)
        in: query
        name: kind
        type: string
      - description: Filtrar por situação (aceita lista separada por vírgula)
        in: query
        name: status
        type: string
      - description: Data inicial (YYYY-MM-DD ou RFC3339)
        in: query
        name: from
        type: string
      - description: Data final (YYYY-MM-DD ou RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/report.ListPage'
      security:
      - BearerAuth: []
      summary: Listar relatórios recentes
      tags:
      - Relatórios
    post:
      consumes:
      - application/json
      description: Coloca a geração do relatório na fila e devolve o identificador
        do trabalho. O arquivo fica pronto de forma assíncrona; acompanhe pelo status.
      parameters:
      - description: Relatório a gerar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/report.CreateReportRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/report.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Solicitar um relatório
      tags:
      - Relatórios
  /reports/{id}:
    get:
      description: 'Devolve a situação do relatório solicitado: na fila, processando,
        pronto, com falha ou expirado.'
      parameters:
      - description: ID do relatório
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/report.Job'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Situação de um relatório
      tags:
      - Relatórios
  /reports/{id}/file:
    get:
      description: Devolve o arquivo gerado. Responde 409 enquanto o relatório não
        está pronto e 410 quando já expirou.
      parameters:
      - description: ID do relatório
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Arquivo do relatório
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Baixar o arquivo do relatório
      tags:
      - Relatórios
  /reports/{id}/print-data:
    get:
      description: Devolve os dados do relatório para a página que o navegador headless
        imprime em PDF. Exige um token de impressão de curta duração, válido apenas
        para um relatório.
      parameters:
      - description: ID do relatório
        in: path
        name: id
        required: true
        type: string
      - description: Token de impressão
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/report_usecase.PrintPayload'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Dados para a página de impressão
      tags:
      - Relatórios
  /reports/kinds:
    get:
      description: Lista os tipos de relatório que este servidor sabe gerar e os formatos
        aceitos por cada um.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/report.KindDescriptor'
              type: array
            type: object
      security:
      - BearerAuth: []
      summary: Tipos de relatório disponíveis
      tags:
      - Relatórios
  /saved-views:
    get:
      description: Retorna as visões salvas do usuário para o tipo de objeto informado
        (conversa por padrão), usadas para configurar o quadro do CRM.
      parameters:
