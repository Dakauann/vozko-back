        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover etapa
      tags:
      - Etapas
    put:
      consumes:
      - application/json
      description: Atualiza o nome, a descrição e/ou a cor de uma etapa existente.
        Todos os campos são opcionais.
      parameters:
      - description: ID da etapa
        in: path
        name: id
        required: true
        type: string
      - description: Campos da etapa a atualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/stage.UpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/stage.Stage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
