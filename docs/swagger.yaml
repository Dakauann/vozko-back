  /whatsapp/campaigns/{id}/entries/export:
    get:
      description: Coloca na fila a exportacao em CSV das entradas (contatos) de uma
        campanha do WhatsApp do workspace, aplicando os filtros informados na query.
        O parâmetro status aceita múltiplos valores, separados por vírgula ou repetidos.
        O arquivo inclui BOM UTF-8 para abertura correta no Excel.
      parameters:
      - description: Identificador da campanha
        in: path
