          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar um evento na agenda
      tags:
      - Agenda
  /calendar/events/{id}:
    delete:
      description: Remove um evento da agenda do workspace. Quando o Google Agenda
        está conectado, o evento também é removido do Google.
      parameters:
      - description: Identificador do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/calendar.DeletedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "412":
          description: Precondition Failed
