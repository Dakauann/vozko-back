  /opportunities/board:
    get:
      description: Renderiza o funil de vendas do workspace agrupado por etapa, responsável
        ou campo personalizado. Cada coluna traz a contagem de oportunidades e a soma
        dos valores (em reais do cliente). Respeita o escopo de departamento do usuário.
      parameters:
      - description: ID do pipeline a exibir
        in: query
        name: pipelineId
        type: string
      - description: Eixo de agrupamento das colunas ('stage', 'owner' ou 'custom')
        in: query
        name: groupBy
        type: string
      - description: Chave do campo personalizado quando groupBy=custom
        in: query
        name: groupByKey
        type: string
      - description: Filtro compartilhado (JSON crmfilter, opcionalmente em base64)
        in: query
        name: filter
        type: string
      - description: Colunas do eixo de responsáveis (JSON, opcionalmente em base64)
        in: query
        name: owners
        type: string
      - description: Colunas do eixo de campo personalizado (JSON, opcionalmente em
          base64)
        in: query
        name: options
        type: string
      - description: Campo de ordenação das oportunidades
        in: query
        name: sortField
        type: string
      - description: Direção da ordenação ('asc' ou 'desc')
        in: query
        name: sortOrder
        type: string
      - description: Página das oportunidades por coluna
        in: query
        name: page
        type: integer
      - description: Tamanho da página (máximo 200)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
