      parameters:
      - description: ID da visão salva
        in: path
        name: id
        required: true
        type: string
      - description: Campos da visão a atualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/savedview.SavedViewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/savedview.SavedView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar uma visão salva
      tags:
      - Visões Salvas
  /saved-views/{id}/default:
    put:
      description: Marca a visão salva informada como a visão padrão do usuário para
        aquele tipo de objeto.
      parameters:
      - description: ID da visão salva
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/savedview.SavedView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Definir visão padrão
      tags:
      - Visões Salvas
  /scheduled-messages:
    get:
      description: Lista as mensagens agendadas de todo o workspace, com paginação.
      parameters:
      - description: Filtro de status separado por vírgula
        in: query
        name: status
        type: string
      - description: Página (padrão 1)
        in: query
        name: page
        type: integer
      - description: Itens por página (padrão 50, máximo 200)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scheduledmessage.WorkspaceScheduledMessagesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar mensagens agendadas do workspace
      tags:
      - Mensagens Agendadas
  /scheduled-messages/{id}:
    delete:
      description: Cancela uma mensagem ainda pendente. Uma mensagem já enviada não
        pode ser cancelada — o cliente já a recebeu.
      parameters:
      - description: ID da mensagem agendada
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
