        resultados, custo por resultado, CTR, CPM) e do CRM (conversas, leads, vendas,
        ROAS). Dias no fuso da conta de anúncios; sem período, os últimos 30 dias.
        Com compare=1, inclui o período anterior de mesmo tamanho.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: campaign, adset ou ad
        in: query
        name: level
