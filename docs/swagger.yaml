  /images/generations:
    post:
      consumes:
      - application/json
      description: Coloca na fila a geração de uma imagem com o modelo escolhido (model,
        um id de GET /images/models; fora da lista responde 422 com model unknown)
        no formato pedido (square 1080x1080, portrait 1080x1350, story 1080x1920).
        Opcionalmente recebe até 16 imagens de referência da biblioteca de mídia do
        workspace (referenceMediaIds, sem repetição, só imagens) para edição ou estilo;
        uma referência inválida responde 422 com o código no campo referenceMediaIds
        (required, too_many, duplicate, not_found ou not_image). Responde 202 com
        o job; acompanhe por GET /images/generations/{id} até status done (mediaId
        e mediaUrl da biblioteca de mídia) ou failed (failureCode). A imagem é cobrada
        do saldo como uso de IA. Um pedido igual do mesmo usuário nos últimos 10 minutos,
        ainda em andamento, devolve o mesmo job sem nova cobrança.
      parameters:
      - description: descrição e formato da imagem
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/imagegenhttp.GenerateImageRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/imagegenhttp.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Gerar imagem com IA
      tags:
      - Imagens
  /images/generations/{id}:
    get:
      description: 'Estado de uma geração de imagem do workspace: queued, running,
        done (com mediaId, mediaUrl e model) ou failed (com failureCode: generation_failed,
        storage_failed, timed_out, enqueue_failed, insufficient_funds ou reference_unavailable).'
      parameters:
      - description: id do job
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/imagegenhttp.JobResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
