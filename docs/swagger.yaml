  /stages:
    get:
      description: Retorna as etapas de UM funil de conversas, na ordem de exibição.
        Informe pipelineId para escolher o funil explicitamente — é o que o CRM usa
        para que a lista de etapas acompanhe o funil selecionado. Sem ele, o funil
        é resolvido pela campanha e, na ausência dela, pelo funil padrão do workspace;
        campaignId e campaignType seguem aceitos por compatibilidade.
      parameters:
      - description: ID do funil (tem precedência sobre a campanha)
        in: query
        name: pipelineId
        type: string
      - description: ID da campanha (compatibilidade)
        in: query
        name: campaignId
        type: string
      - description: Tipo da campanha (compatibilidade)
        in: query
        name: campaignType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/stage.Stage'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar etapas
      tags:
      - Etapas
    post:
      consumes:
      - application/json
      description: Cria uma nova etapa (coluna do funil) no pipeline de conversas
        do workspace. O nome é obrigatório e a cor é opcional (formato hexadecimal).
      parameters:
      - description: Dados da etapa a criar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/stage.CreateTagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/stage.Stage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar etapa
      tags:
      - Etapas
  /stages/{id}:
    delete:
      description: Exclui uma etapa do pipeline do workspace. Etapas padrão não podem
        ser removidas.
      parameters:
      - description: ID da etapa
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
