  /webhooks/workflow/{token}:
    post:
      consumes:
      - application/json
      description: 'Endpoint público, autenticado pelo token na URL e, opcionalmente,
        por header_token ou HMAC, que inicia uma execução do workflow associado. O
        corpo JSON identifica a entrada de UMA forma: entry_id + entry_type, quando
        o chamador já conhece o id interno; OU phone, que é resolvido para a conversa
        de WhatsApp mais recente da workspace. Redisparos idênticos são deduplicados
        (status "duplicate"); se já houver execução ativa para a mesma entrada e gatilho,
        retorna "already_running". Campos extras do provedor ficam disponíveis no
        workflow em {{webhook.body}}.'
      parameters:
      - description: Token do webhook
        in: path
        name: token
        required: true
        type: string
      - description: Identificação da entrada e dados do provedor
        in: body
        name: body
        schema:
          $ref: '#/definitions/workflowwebhook.webhookTriggerRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Execução iniciada, já em andamento ou duplicada
          schema:
            $ref: '#/definitions/workflowwebhook.webhookTriggerResponse'
        "400":
          description: Payload sem entry_id/entry_type e sem phone
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Autenticação inválida
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Webhook ou entrada não encontrados
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: O workflow não está ativo
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: O workflow não possui nó de gatilho de webhook
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: Limite de execuções simultâneas atingido
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Receptor público de webhook que inicia uma execução de workflow
      tags:
      - webhooks
