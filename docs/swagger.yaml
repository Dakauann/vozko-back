        "201":
          description: Created
          schema:
            $ref: '#/definitions/leadmemory.LeadMemoryEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Limite de memórias do lead atingido, ou conversa sem lead vinculado
