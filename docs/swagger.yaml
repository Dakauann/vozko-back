        example: 6000000
        type: integer
    type: object
info:
  contact: {}
  description: API de comunicação omnichannel e call center.
  title: API
  version: "1.0"
paths:
  /ads/accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertisinghttp.AccountResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar contas de anúncios
      tags:
      - Anúncios
  /ads/accounts/{id}:
    delete:
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Desconectar conta de anúncios
      tags:
      - Anúncios
  /ads/accounts/{id}/apps:
    get:
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertisinghttp.AppResponse'
            type: array
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Aplicativos da conta de anúncios
      tags:
      - Anúncios
  /ads/accounts/{id}/audiences:
    get:
      description: Públicos da conta na Meta e se os termos de públicos personalizados
        foram aceitos (sem eles, não dá para criar listas nem semelhantes).
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.AudienceListResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Públicos personalizados da conta
      tags:
      - Anúncios
  /ads/accounts/{id}/budget-minimum:
    get:
      description: Mínimo diário que a Meta aceita para um conjunto de anúncios desta
        conta com a meta de otimização informada, em unidades menores da moeda da
        conta. Com lance manual, informe bidAmount. Contas só de leitura recebem 409
        account_read_only.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: meta de otimização, como LINK_CLICKS
        in: query
        name: goal
        required: true
        type: string
      - description: lance manual em unidades menores da moeda da conta
        in: query
        name: bidAmount
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.BudgetMinimumResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Orçamento diário mínimo
      tags:
      - Anúncios
  /ads/accounts/{id}/catalogs:
    get:
      description: Catálogos do portfólio empresarial da conta, com os conjuntos de
        produtos.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertisinghttp.CatalogResponse'
            type: array
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Catálogos de produtos
      tags:
      - Anúncios
  /ads/accounts/{id}/drafts:
    get:
      description: Rascunhos guardados no Vozko (a Meta não expõe os rascunhos dela
        pela API). Cada rascunho é uma árvore de campanha, conjunto e anúncios; rows
        traz as linhas que entram na tabela como "Em rascunho" e objectCount soma
        essas linhas, o número de "Conferir e publicar". Rascunhos já publicados saem
        da lista.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.DraftListResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar rascunhos da conta
      tags:
      - Anúncios
  /ads/accounts/{id}/drafts/discard:
    post:
      description: Exclui todos os rascunhos da conta, menos os que estão sendo publicados.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.DiscardResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Descartar rascunhos da conta
      tags:
      - Anúncios
  /ads/accounts/{id}/insights:
    get:
      description: Consulta a Meta na hora, com quebras (idade, gênero, país, região,
        plataforma, posicionamento, dispositivo, hora do dia), janelas de atribuição,
        alcance, frequência e métricas de vídeo. Sem período, os últimos 30 dias.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: campaign, adset ou ad
        in: query
        name: level
        type: string
      - description: YYYY-MM-DD
        in: query
        name: since
        type: string
      - description: YYYY-MM-DD
        in: query
        name: until
        type: string
      - description: IDs na Meta separados por vírgula
        in: query
        name: objectIds
        type: string
      - description: quebras separadas por vírgula, por exemplo age,gender
        in: query
        name: breakdowns
        type: string
      - description: janelas de atribuição separadas por vírgula, por exemplo 7d_click,1d_view
        in: query
        name: windows
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.LiveReportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resultados ao vivo da Meta
      tags:
      - Anúncios
  /ads/accounts/{id}/locations:
    get:
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: texto da busca (mínimo 2 letras)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertisinghttp.LocationResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Buscar locais para segmentação
      tags:
      - Anúncios
  /ads/accounts/{id}/pages:
    get:
      description: 'Páginas da conexão de anúncios, o número de WhatsApp vinculado
        a cada uma, os números do workspace iguais a ele (numbers), os números do
        workspace que a página pode receber (linkable: oficiais do mesmo portfólio
        da página, ou não oficiais) e capabilities: para cada canal da Meta (advertise,
        whatsapp, instagram, messenger, lead_forms) se a página está pronta e, quando
        não, a ação in_app (link_whatsapp, connect_whatsapp) ou a url da tela da Meta.'
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertisinghttp.PageResponse'
            type: array
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Páginas que podem anunciar
      tags:
      - Anúncios
  /ads/accounts/{id}/pages/{pageId}/forms:
    get:
      description: Formulários de cadastro da página. Listar também passa a acompanhar
        os leads de cada formulário.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: ID da página
        in: path
        name: pageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertising.LeadForm'
            type: array
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Formulários instantâneos da página
      tags:
      - Anúncios
  /ads/accounts/{id}/pages/{pageId}/instant-experiences:
    get:
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: ID da página
        in: path
        name: pageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertisinghttp.InstantExperienceResponse'
            type: array
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Experiências instantâneas da página
      tags:
      - Anúncios
  /ads/accounts/{id}/pages/{pageId}/posts:
    get:
      description: Publicações da página no Facebook ou mídias do Instagram vinculado,
        para usar como anúncio.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: ID da página
        in: path
        name: pageId
        required: true
        type: string
      - description: facebook ou instagram
        in: query
        name: platform
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertisinghttp.PostResponse'
            type: array
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Publicações da página para anunciar
      tags:
      - Anúncios
  /ads/accounts/{id}/pages/{pageId}/posts/{postId}:
    get:
      description: Uma publicação do Facebook ou do Instagram da página, para a prévia
        de um rascunho que usa publicação existente. Só lê; recusa publicações de
        outra página.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: ID da página
        in: path
        name: pageId
        required: true
        type: string
      - description: ID da publicação ou da mídia do Instagram
        in: path
        name: postId
        required: true
        type: string
      - description: facebook ou instagram
        in: query
        name: platform
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.PostResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Publicação da página
      tags:
      - Anúncios
  /ads/accounts/{id}/pages/{pageId}/whatsapp-link:
    post:
      consumes:
      - application/json
      description: Envia à Meta o código recebido no WhatsApp e devolve a página atualizada.
        422 com code invalid para um código fora do formato (4 a 8 dígitos); 409 page_link_refused
        quando a Meta não confirma o vínculo. A Meta pode levar alguns instantes para
        mostrar o número em whatsAppNumber; a publicação só libera quando ele aparece.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: ID da página na Meta
        in: path
        name: pageId
        required: true
        type: string
      - description: número e código
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/advertisinghttp.NumberLinkConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.PageResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirmar vínculo de WhatsApp com a página
      tags:
      - Anúncios
  /ads/accounts/{id}/pages/{pageId}/whatsapp-link/code:
    post:
      consumes:
      - application/json
      description: Pede à Meta que envie, por WhatsApp, o código que vincula o número
        à página. O número precisa estar em linkable da página (oficial do mesmo portfólio,
        ou não oficial). Responde status code_sent quando o código foi enviado (ele
        chega no app do WhatsApp do número, não na caixa de entrada do Vozko) ou linked
        quando a Meta informa que o número já está vinculado; nesse caso o vínculo
        é registrado e a página atualizada vem em page. 422 com number not_linkable
        para um número que a página não pode receber; 409 page_link_refused para qualquer
        outra resposta da Meta.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: ID da página na Meta
        in: path
        name: pageId
        required: true
        type: string
      - description: número a vincular
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/advertisinghttp.NumberLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.NumberLinkStartResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pedir código para vincular WhatsApp à página
      tags:
      - Anúncios
  /ads/accounts/{id}/pixels:
    get:
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/advertising.Pixel'
            type: array
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pixels da conta de anúncios
      tags:
      - Anúncios
    post:
      consumes:
      - application/json
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: nome do pixel
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/advertisinghttp.CreatePixelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/advertising.Pixel'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar pixel
      tags:
      - Anúncios
  /ads/accounts/{id}/reach-estimate:
    post:
      consumes:
      - application/json
      description: Estimativa da Meta para o público e os posicionamentos. Sem locais,
        volta vazia com ready false.
      parameters:
      - description: ID da conta de anúncios
        in: path
        name: id
        required: true
        type: string
      - description: público, posicionamentos e meta de otimização
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/advertisinghttp.ReachRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/advertisinghttp.ReachResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
